<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Głosowanie</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --danger: #dc2626;
      --success: #16a34a;
      --success-bg: #dcfce7;
      --danger-bg: #fee2e2;
      --blue-bg: #eef2ff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      padding: 55px 20px 95px;
      text-align: center;
      color: white;

      background:
        linear-gradient(
          135deg,
          #111827 0%,
          #312e81 50%,
          #4f46e5 100%
        );
    }

    .logo {
      width: 72px;
      height: 72px;

      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      background: rgba(255,255,255,.14);

      font-size: 35px;

      box-shadow:
        0 10px 30px rgba(0,0,0,.15);
    }

    header h1 {
      margin: 0;

      font-size:
        clamp(36px, 8vw, 60px);

      letter-spacing: -1px;
    }

    header p {
      max-width: 620px;

      margin: 14px auto 0;

      color:
        rgba(255,255,255,.78);

      line-height: 1.6;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width:
        min(
          900px,
          calc(100% - 24px)
        );

      margin:
        -50px auto 50px;
    }

    .card {
      background: var(--card);

      border-radius: 22px;

      box-shadow:
        0 10px 35px
        rgba(15,23,42,.08);
    }

    /* =========================
       MESSAGE
    ========================= */

    #message {
      margin-bottom: 16px;
    }

    .message {
      padding: 14px 16px;

      border-radius: 12px;

      font-size: 14px;
      font-weight: 700;
    }

    .message.success {
      background: var(--success-bg);
      color: #166534;
    }

    .message.error {
      background: var(--danger-bg);
      color: #991b1b;
    }

    /* =========================
       CREATE
    ========================= */

    .create {
      padding: 26px;

      margin-bottom: 30px;
    }

    .section-title {
      display: flex;
      align-items: center;

      gap: 13px;

      margin-bottom: 22px;
    }

    .section-icon {
      width: 46px;
      height: 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border-radius: 14px;

      background: var(--blue-bg);

      color: var(--primary);

      font-size: 24px;
    }

    .section-title h2 {
      margin: 0;

      font-size: 22px;
    }

    .section-title p {
      margin: 4px 0 0;

      color: var(--muted);

      font-size: 13px;
    }

    .label {
      display: block;

      margin:
        12px 0 9px;

      color: #374151;

      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;

      padding: 14px 15px;

      margin-bottom: 10px;

      border:
        1px solid var(--border);

      border-radius: 12px;

      outline: none;

      background: white;

      color: var(--text);

      transition:
        border-color .2s,
        box-shadow .2s;
    }

    input::placeholder {
      color: #9ca3af;
    }

    input:focus {
      border-color: #818cf8;

      box-shadow:
        0 0 0 4px
        rgba(99,102,241,.12);
    }

    .create-button {
      width: 100%;

      margin-top: 5px;

      padding: 14px;

      border: 0;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #4f46e5,
          #6366f1
        );

      color: white;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform .15s,
        opacity .15s;
    }

    .create-button:hover:not(:disabled) {
      transform:
        translateY(-1px);
    }

    .create-button:disabled {
      opacity: .6;

      cursor: wait;
    }

    /* =========================
       POLLS HEADER
    ========================= */

    .polls-header {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin:
        0 4px 15px;
    }

    .polls-header h2 {
      margin: 0;

      font-size: 22px;
    }

    .count {
      min-width: 30px;

      padding: 6px 11px;

      text-align: center;

      border-radius: 999px;

      background: #e0e7ff;

      color: #4338ca;

      font-size: 12px;
      font-weight: 700;
    }

    /* =========================
       POLL
    ========================= */

    .poll {
      padding: 24px;

      margin-bottom: 17px;
    }

    .poll-top {
      display: flex;

      justify-content: space-between;
      align-items: flex-start;

      gap: 15px;
    }

    .question {
      margin: 0;

      font-size: 21px;

      line-height: 1.4;

      overflow-wrap:
        anywhere;
    }

    .delete-button {
      flex-shrink: 0;

      padding: 8px 11px;

      border:
        1px solid #fecaca;

      border-radius: 9px;

      background: white;

      color: var(--danger);

      font-size: 12px;
      font-weight: 700;

      cursor: pointer;

      transition: background .15s;
    }

    .delete-button:hover {
      background: #fef2f2;
    }

    /* =========================
       META
    ========================= */

    .meta {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin:
        10px 0 20px;
    }

    .badge {
      padding: 6px 9px;

      border-radius: 8px;

      background: #f3f4f6;

      color: var(--muted);

      font-size: 12px;
      font-weight: 600;
    }

    .badge.voted {
      background:
        var(--success-bg);

      color: #166534;
    }

    /* =========================
       OPTIONS
    ========================= */

    .option {
      margin: 12px 0;
    }

    .vote-button {
      position: relative;

      overflow: hidden;

      width: 100%;

      min-height: 54px;

      padding: 14px 15px;

      border:
        1px solid var(--border);

      border-radius: 12px;

      background: white;

      text-align: left;

      cursor: pointer;

      transition:
        border-color .15s,
        transform .15s,
        background .15s;
    }

    .vote-button:hover:not(:disabled) {
      border-color: #818cf8;

      transform:
        translateY(-1px);
    }

    .vote-button:disabled {
      cursor: default;
    }

    .vote-button.selected {
      border-color: #818cf8;

      background: #fafaff;
    }

    .progress {
      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      width: 0;

      background:
        rgba(99,102,241,.10);

      pointer-events: none;

      transition:
        width .4s ease;
    }

    .vote-content {
      position: relative;

      z-index: 2;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 12px;

      font-weight: 700;
    }

    .option-text {
      overflow-wrap: anywhere;
    }

    .percent {
      flex-shrink: 0;

      color: var(--muted);

      font-size: 13px;
    }

    .option-info {
      display: flex;

      justify-content: space-between;

      gap: 10px;

      padding:
        5px 4px 0;

      color: var(--muted);

      font-size: 12px;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      padding: 55px 20px;

      text-align: center;

      color: var(--muted);
    }

    .spinner {
      width: 32px;
      height: 32px;

      margin:
        0 auto 13px;

      border:
        3px solid #e5e7eb;

      border-top-color:
        var(--primary);

      border-radius: 50%;

      animation:
        spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform:
          rotate(360deg);
      }
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      padding: 55px 20px;

      text-align: center;
    }

    .empty-icon {
      margin-bottom: 10px;

      font-size: 45px;
    }

    .empty h3 {
      margin:
        0 0 7px;
    }

    .empty p {
      margin: 0;

      color: var(--muted);

      line-height: 1.5;
    }

    .retry-button {
      margin-top: 18px;

      padding: 10px 15px;

      border: 0;

      border-radius: 10px;

      background: var(--primary);

      color: white;

      font-weight: 700;

      cursor: pointer;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;

      inset: 0;

      z-index: 1000;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(15,23,42,.55);

      backdrop-filter:
        blur(4px);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width:
        min(420px,100%);

      padding: 25px;

      border-radius: 20px;

      background: white;

      box-shadow:
        0 25px 70px
        rgba(0,0,0,.25);
    }

    .modal-box h3 {
      margin:
        0 0 8px;
    }

    .modal-box p {
      margin: 0;

      color: var(--muted);

      line-height: 1.5;
    }

    .modal-buttons {
      display: flex;

      gap: 10px;

      margin-top: 22px;
    }

    .modal-buttons button {
      flex: 1;

      padding: 12px;

      border-radius: 10px;

      cursor: pointer;

      font-weight: 700;
    }

    .cancel-button {
      border:
        1px solid var(--border);

      background: white;
    }

    .confirm-button {
      border: 0;

      background:
        var(--danger);

      color: white;
    }

    .confirm-button:disabled {
      opacity: .6;

      cursor: wait;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 20px;

      text-align: center;

      color: #9ca3af;

      font-size: 12px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding:
          40px 18px 78px;
      }

      main {
        width:
          calc(100% - 16px);
      }

      .create,
      .poll {
        padding: 18px;
      }

      .poll-top {
        flex-direction: column;
      }

      .delete-button {
        align-self: flex-end;
      }

      .question {
        font-size: 19px;
      }

      .modal-buttons {
        flex-direction:
          column-reverse;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    🗳️
  </div>

  <h1>Głosowanie</h1>

  <p>
    Twórz ankiety, głosuj i sprawdzaj
    wyniki w prosty sposób.
  </p>

</header>


<main>

  <div id="message"></div>


  <!-- =========================
       TWORZENIE ANKIETY
  ========================== -->

  <section class="card create">

    <div class="section-title">

      <div class="section-icon">
        ＋
      </div>

      <div>

        <h2>
          Nowa ankieta
        </h2>

        <p>
          Utwórz pytanie i dodaj odpowiedzi.
        </p>

      </div>

    </div>


    <input
      id="question"
      type="text"
      maxlength="200"
      autocomplete="off"
      placeholder="Wpisz pytanie ankiety"
    >


    <span class="label">
      Odpowiedzi
    </span>


    <input
      id="option1"
      type="text"
      maxlength="100"
      autocomplete="off"
      placeholder="Odpowiedź A"
    >


    <input
      id="option2"
      type="text"
      maxlength="100"
      autocomplete="off"
      placeholder="Odpowiedź B"
    >


    <input
      id="option3"
      type="text"
      maxlength="100"
      autocomplete="off"
      placeholder="Odpowiedź C — opcjonalnie"
    >


    <input
      id="option4"
      type="text"
      maxlength="100"
      autocomplete="off"
      placeholder="Odpowiedź D — opcjonalnie"
    >


    <button
      id="createButton"
      class="create-button"
      type="button"
    >
      ＋ Utwórz ankietę
    </button>

  </section>


  <!-- =========================
       LISTA ANKIET
  ========================== -->

  <div class="polls-header">

    <h2>
      📊 Ankiety
    </h2>

    <span
      id="pollCount"
      class="count"
    >
      0
    </span>

  </div>


  <div id="polls">

    <div class="card loading">

      <div class="spinner"></div>

      Ładowanie ankiet...

    </div>

  </div>

</main>


<footer>
  Głosowanie
</footer>


<!-- =========================
     MODAL USUWANIA
========================== -->

<div
  id="deleteModal"
  class="modal"
>

  <div class="modal-box">

    <h3>
      Usunąć ankietę?
    </h3>

    <p>
      Ankieta, odpowiedzi oraz związane z nią
      głosy zostaną usunięte.
      Tej operacji nie można cofnąć.
    </p>


    <div class="modal-buttons">

      <button
        id="cancelDeleteButton"
        class="cancel-button"
        type="button"
      >
        Anuluj
      </button>


      <button
        id="confirmDeleteButton"
        class="confirm-button"
        type="button"
      >
        Usuń ankietę
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://hvloevnsrbfmmrkohzxe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable__iN5fmthHgtL_WfMM08sUw_7PCFKJgl";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   IDENTYFIKATOR UŻYTKOWNIKA
========================================================= */

function getUserId() {

  let id =
    localStorage.getItem(
      "voter_id"
    );


  if (!id) {

    id =
      crypto.randomUUID();

    localStorage.setItem(
      "voter_id",
      id
    );

  }


  return id;
}


const userId =
  getUserId();


/* =========================================================
   STAN
========================================================= */

let pollsCache = [];

let pollToDelete = null;

let isLoading = false;


/*
 * Lokalna pamięć jest używana wyłącznie do
 * szybkiego pokazania informacji "zagłosowano".
 *
 * Rzeczywiste zabezpieczenie znajduje się w bazie:
 *
 * UNIQUE (poll_id, user_id)
 */

function getLocalVotes() {

  try {

    const value =
      localStorage.getItem(
        "voted_polls"
      );

    const parsed =
      JSON.parse(
        value || "[]"
      );

    return Array.isArray(parsed)
      ? parsed.map(String)
      : [];

  } catch {

    return [];

  }

}


function hasLocalVote(pollId) {

  return getLocalVotes()
    .includes(
      String(pollId)
    );

}


function rememberLocalVote(pollId) {

  const votes =
    getLocalVotes();

  const id =
    String(pollId);


  if (!votes.includes(id)) {

    votes.push(id);

    localStorage.setItem(
      "voted_polls",
      JSON.stringify(votes)
    );

  }

}


/* =========================================================
   WIADOMOŚCI
========================================================= */

function showMessage(
  text,
  type = "error"
) {

  const container =
    document.getElementById(
      "message"
    );


  container.innerHTML = "";


  const message =
    document.createElement(
      "div"
    );


  message.className =
    "message " + type;


  message.textContent =
    text;


  container.appendChild(
    message
  );


  window.setTimeout(
    () => {

      if (
        container.contains(
          message
        )
      ) {

        container.innerHTML = "";

      }

    },
    4500
  );

}


/* =========================================================
   LICZBY / ODMIANA
========================================================= */

function toSafeNumber(value) {

  const number =
    Number(value);


  if (
    !Number.isFinite(number) ||
    number < 0
  ) {

    return 0;

  }


  return Math.floor(
    number
  );

}


function pluralize(
  number,
  one,
  few,
  many
) {

  const n =
    Math.abs(
      Number(number)
    );


  if (n === 1) {

    return one;

  }


  const lastTwo =
    n % 100;


  if (
    lastTwo >= 12 &&
    lastTwo <= 14
  ) {

    return many;

  }


  const last =
    n % 10;


  if (
    last >= 2 &&
    last <= 4
  ) {

    return few;

  }


  return many;

}


/* =========================================================
   FORMATOWANIE BŁĘDÓW
========================================================= */

function readableError(error) {

  if (!error) {

    return "Wystąpił nieznany błąd.";

  }


  if (
    error.code === "23505"
  ) {

    return (
      "Na tę ankietę został już oddany głos."
    );

  }


  if (
    error.code === "42501"
  ) {

    return (
      "Supabase zablokował tę operację przez RLS. Sprawdź polityki tabel."
    );

  }


  return (
    error.message ||
    "Wystąpił nieznany błąd."
  );

}


/* =========================================================
   ŁADOWANIE ANKIET
========================================================= */

async function loadPolls() {

  if (isLoading) {

    return;

  }


  isLoading = true;


  const container =
    document.getElementById(
      "polls"
    );


  container.innerHTML = `
    <div class="card loading">
      <div class="spinner"></div>
      Ładowanie ankiet...
    </div>
  `;


  try {

    /*
     * Pobieramy ankiety i odpowiedzi.
     *
     * UWAGA:
     * Nie pobieramy options.votes.
     * Liczniki są obliczane z tabeli votes.
     */

    const {
      data: polls,
      error: pollsError
    } =
      await supabaseClient
        .from("polls")
        .select(`
          id,
          question,
          author_id,
          created_at,
          options (
            id,
            poll_id,
            text
          )
        `)
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (pollsError) {

      throw pollsError;

    }


    const safePolls =
      Array.isArray(polls)
        ? polls
        : [];


    pollsCache =
      safePolls;


    /*
     * Pobieramy WSZYSTKIE głosy.
     *
     * W SQL musisz mieć policy:
     *
     * create policy "votes_select"
     * on public.votes
     * for select
     * to anon, authenticated
     * using (true);
     */

    const {
      data: votes,
      error: votesError
    } =
      await supabaseClient
        .from("votes")
        .select(`
          poll_id,
          option_id,
          user_id
        `);


    if (votesError) {

      throw votesError;

    }


    const safeVotes =
      Array.isArray(votes)
        ? votes
        : [];


    /*
     * Tworzymy mapę:
     *
     * pollId -> liczba wszystkich głosów
     *
     * oraz:
     *
     * optionId -> liczba głosów
     */

    const pollVoteCounts =
      new Map();

    const optionVoteCounts =
      new Map();


    safeVotes.forEach(
      vote => {

        const pollId =
          String(
            vote.poll_id
          );


        const optionId =
          String(
            vote.option_id
          );


        pollVoteCounts.set(
          pollId,
          (
            pollVoteCounts.get(
              pollId
            ) || 0
          ) + 1
        );


        optionVoteCounts.set(
          optionId,
          (
            optionVoteCounts.get(
           optionVoteCounts.set(
            optionId,
            (
              optionVoteCounts.get(
                optionId
              ) || 0
            ) + 1
          );

        }
    );


    /*
     * Łączymy dane z ankiet z rzeczywistymi
     * głosami znajdującymi się w tabeli votes.
     */

    const currentUserVotes =
      new Set();


    safeVotes.forEach(
      vote => {

        if (
          String(vote.user_id) ===
          String(userId)
        ) {

          currentUserVotes.add(
            String(vote.poll_id)
          );

        }

      }
    );


    /*
     * Jeżeli lokalny localStorage mówi,
     * że użytkownik głosował, również
     * uwzględniamy tę informację.
     */

    getLocalVotes().forEach(
      pollId => {

        currentUserVotes.add(
          String(pollId)
        );

      }
    );


    /*
     * Dodajemy policzone głosy do ankiet.
     */

    safePolls.forEach(
      poll => {

        const pollId =
          String(poll.id);


        const options =
          Array.isArray(
            poll.options
          )
            ? poll.options
            : [];


        poll.total_votes =
          pollVoteCounts.get(
            pollId
          ) || 0;


        poll.options =
          options.map(
            option => {

              const optionId =
                String(
                  option.id
                );


              return {
                ...option,

                vote_count:
                  optionVoteCounts.get(
                    optionId
                  ) || 0

              };

            }
          );

      }
    );


    /*
     * Aktualizujemy licznik ankiet.
     */

    document.getElementById(
      "pollCount"
    ).textContent =
      safePolls.length;


    if (
      safePolls.length === 0
    ) {

      container.innerHTML = `
        <div class="card empty">

          <div class="empty-icon">
            📊
          </div>

          <h3>
            Brak ankiet
          </h3>

          <p>
            Utwórz pierwszą ankietę powyżej.
          </p>

        </div>
      `;

      return;

    }

function renderPoll(

  hasVoted
) {

  const container =

    );


  const card =
    document.createElement(
      "article"
    );

  card.className =

  /* -------------------------

  ------------------------- */

  const top =
    document.createElement(
      "div"
    );

  top.className =
    "poll-top";


  const question =
    document.createElement(
      "h2"
    );

  question.className =
    "question";

  question.textContent =
    poll.question;


  top.appendChild(
    question
  );


  /*
   * Autor może usunąć swoją ankietę.
   */

  if (
    String(poll.author_id) ===
    String(userId)
  ) {

    const deleteButton =
      document.createElement(
        "button"
      );

    deleteButton.type =
      "button";

    deleteButton.className =
      "delete-button";

    deleteButton.textContent =
      "🗑️ Usuń";


    deleteButton.addEventListener(
      "click",
      () => {

        openDeleteModal(
          poll.id
        );

      }
    );


    top.appendChild(
      deleteButton
    );

  }


  card.appendChild(
    top
  );


  /* -------------------------
     OPCJE
  ------------------------- */

  const options =
    Array.isArray(
      poll.options
    )
      ? poll.options
      : [];


  /*
   * RZECZYWISTA liczba wszystkich
   * głosów w tej ankiecie.
   */

  const totalVotes =
    toSafeNumber(
      poll.total_votes
    );


  /* -------------------------
     META
  ------------------------- */

  const meta =
    document.createElement(
      "div"
    );

  meta.className =
    "meta";


  const dateBadge =
    document.createElement(
      "span"
    );

  dateBadge.className =
    "badge";


  let dateText =
    "brak daty";


  if (
    poll.created_at
  ) {

    const date =
      new Date(
        poll.created_at
      );


    if (
      !Number.isNaN(
        date.getTime()
      )
    ) {

      dateText =
        date.toLocaleDateString(
          "pl-PL"
        );

    }

  }


  dateBadge.textContent =
    "📅 " +
    dateText;


  meta.appendChild(
    dateBadge
  );


  const votesBadge =
    document.createElement(
      "span"
    );

  votesBadge.className =
    "badge";


  votesBadge.textContent =
    "🗳️ " +
    totalVotes +
    " " +
    pluralize(
      totalVotes,
      "głos",
      "głosy",
      "głosów"
    );


  meta.appendChild(
    votesBadge
  );


  if (
    hasVoted
  ) {

    const votedBadge =
      document.createElement(
        "span"
      );

    votedBadge.className =
      "badge voted";

    votedBadge.textContent =
      "✓ Zagłosowano";


    meta.appendChild(
      votedBadge
    );

  }


  card.appendChild(
    meta
  );


  /* -------------------------
     ODPOWIEDZI
  ------------------------- */

  options.forEach(
    (option, index) => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "option";


      /*
       * Liczba głosów pochodzi
       * bezpośrednio z tabeli votes.
       */

      const optionVotes =
        toSafeNumber(
          option.vote_count
        );


      /*
       * Procent liczony jest z:
       *
       * głosy odpowiedzi
       * ----------------
       * wszystkie głosy ankiety
       */

      let percentage = 0;


      if (
        totalVotes > 0
      ) {

        percentage =
          Math.round(
            (
              optionVotes /
              totalVotes
            ) *
            100
          );

      }


      /*
       * Drobna korekta bezpieczeństwa.
       */

      percentage =
        Math.max(
          0,
          Math.min(
            100,
            percentage
          )
        );


      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "vote-button";


      if (
        hasVoted
      ) {

        button.disabled =
          true;

      }


      /*
       * Pasek procentowy.
       */

      const progress =
        document.createElement(
          "div"
        );

      progress.className =
        "progress";

      progress.style.width =
        percentage +
        "%";


      button.appendChild(
        progress
      );


      /*
       * Tekst odpowiedzi.
       */

      const content =
        document.createElement(
          "div"
        );

      content.className =
        "vote-content";


      const optionText =
        document.createElement(
          "span"
        );

      optionText.className =
        "option-text";

      optionText.textContent =
        option.text;


      const percent =
        document.createElement(
          "span"
        );

      percent.className =
        "percent";

      percent.textContent =
        percentage +
        "%";


      content.appendChild(
        optionText
      );

      content.appendChild(
        percent
      );


      button.appendChild(
        content
      );


      /*
       * Głosowanie.
       */

      if (
        !hasVoted
      ) {

        button.addEventListener(
          "click",
          () => {

            vote(
              poll.id,
              option.id
            );

          }
        );

      }


      row.appendChild(
        button
      );


      /*
       * Informacja pod przyciskiem.
       */

      const info =
        document.createElement(
          "div"
        );

      info.className =
        "option-info";


      const voteText =
        document.createElement(
          "span"
        );

      voteText.textContent =
        optionVotes +
        " " +
        pluralize(
          optionVotes,
          "głos",
          "głosy",
          "głosów"
        );


      const answerText =
        document.createElement(
          "span"
        );

      answerText.textContent =
        "Odpowiedź " +
        (index + 1);


      info.appendChild(
        voteText
      );

      info.appendChild(
        answerText
      );


      row.appendChild(
        info
      );


      card.appendChild(
        row
      );

    }
  );


  container.appendChild(
    card
  );

}

========================================================= */

async function vote(
  pollId,
  optionId
) {

  /*
   * Sprawdzamy lokalnie przed wysłaniem.
   */

  if (
    hasLocalVote(
      pollId
    )
  ) {

    showMessage(
      "Na tę ankietę już głosowałeś."
    );

    return;

  }


  /*
   * Znajdujemy wszystkie przyciski
   * tej ankiety i tymczasowo je blokujemy.
   */

  const poll =
    pollsCache.find(
      item =>
        String(item.id) ===
        String(pollId)
    );


  if (!poll) {

    showMessage(
      "Nie znaleziono ankiety."
    );

    return;

  }


  try {

    const buttons =
      document.querySelectorAll(
        ".vote-button"
      );


    buttons.forEach(
      button => {

        button.disabled =
          true;

      }
    );


    /*
     * NAJWAŻNIEJSZE:
     *
     * Dodajemy jeden rekord do votes.
     *
     * option_id musi wskazywać
     * na ID odpowiedzi z tabeli options.
     */

    const {
      error
    } =
      await supabaseClient
        .from("votes")
        .insert({
          poll_id:
            pollId,

          option_id:
            optionId,

          user_id:
            userId
        });


    if (error) {

      /*
       * 23505 = UNIQUE violation.
       * Oznacza, że użytkownik już zagłosował.
       */

      if (
        error.code ===
        "23505"
      ) {

        rememberLocalVote(
          pollId
        );


        showMessage(
          "Na tę ankietę już głosowałeś."
        );


        await loadPolls();

        return;

      }


      throw error;

    }


    /*
     * Zapamiętujemy głos lokalnie.
     */

    rememberLocalVote(
      pollId
    );


    showMessage(
      "Głos został zapisany!",
      "success"
    );


    /*
     * Ponownie pobieramy dane z Supabase.
     *
     * NIE zwiększamy ręcznie liczników.
     * Dzięki temu liczby i procenty
     * pochodzą z rzeczywistych rekordów votes.
     */

    await loadPolls();

  }

  catch (error) {

    console.error(
      "VOTE ERROR:",
      error
    );


    showMessage(
      readableError(
        error
      )
    );


    /*
     * Przywracamy możliwość głosowania.
     */

    await loadPolls();

  }

}

async function createPoll() {

  const button =
    document.getElementById(
      "createButton"
    );


  const question =
    document
      .getElementById(
        "question"
      )
      .value
      .trim();


  const options = [

    document
      .getElementById(
        "option1"
      )
      .value
      .trim(),

    document
      .getElementById(
        "option2"
      )
      .value
      .trim(),

    document
      .getElementById(
        "option3"
      )
      .value
      .trim(),

    document
      .getElementById(
        "option4"
      )
      .value
      .trim()

  ].filter(
    Boolean
  );


  if (!question) {

    showMessage(
      "Wpisz pytanie ankiety."
    );

    return;

  }


  if (
    options.length < 2
  ) {

    showMessage(
      "Dodaj przynajmniej 2 odpowiedzi."
    );

    return;

  }


  /*
   * Usuwamy duplikaty odpowiedzi.
   */

  const uniqueOptions =
    [
      ...new Set(
        options.map(
          option =>
            option.toLowerCase()
        )
      )
    ];


  if (
    uniqueOptions.length !==
    options.length
  ) {

    showMessage(
      "Odpowiedzi w jednej ankiecie muszą być różne."
    );

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "Tworzenie...";


  try {

    /*
     * Tworzymy ankietę.
     */

    const {
      data: poll,
      error: pollError
    } =
      await supabaseClient
        .from("polls")
        .insert({
          question:
            question,

          author_id:
            userId
        })
        .select(
          "id"
        )
        .single();


    if (pollError) {

      throw pollError;

    }


    if (
      !poll ||
      !poll.id
    ) {

      throw new Error(
        "Supabase nie zwrócił ID utworzonej ankiety."
      );

    }


    /*
     * Tworzymy odpowiedzi.
     *
     * NIE dodajemy tutaj votes = 0.
     * Liczniki są obliczane z tabeli votes.
     */

    const optionRows =
      options.map(
        text => ({
          poll_id:
            poll.id,

          text:
            text
        })
      );


    const {
      error:
        optionsError
    } =
      await supabaseClient
        .from("options")
        .insert(
          optionRows
        );


    if (optionsError) {

      /*
       * Jeżeli odpowiedzi nie zostały
       * utworzone, próbujemy usunąć
       * pustą ankietę.
       */

      await supabaseClient
        .from("polls")
        .delete()
        .eq(
          "id",
          poll.id
        );


      throw optionsError;

    }


    /*
     * Czyścimy formularz.
     */

    [
      "question",
      "option1",
      "option2",
      "option3",
      "option4"
    ].forEach(
      id => {

        document.getElementById(
          id
        ).value = "";

      }
    );


    showMessage(
      "Ankieta została utworzona!",
      "success"
    );


    await loadPolls();

  }

  catch (error) {

    console.error(
      "CREATE POLL ERROR:",
      error
    );


    showMessage(
      readableError(
        error
      )
    );

  }

  finally {

    button.disabled =
      false;

    button.textContent =
      "＋ Utwórz ankietę";

  }

}

async function deletePoll() {

  if (
    pollToDelete ===
    null
  ) {

    return;

  }


  const pollId =
    pollToDelete;


  const button =
    document.getElementById(
      "confirmDeleteButton"
    );


  button.disabled =
    true;

  button.textContent =
    "Usuwanie...";


  try {

    /*
     * Najpierw sprawdzamy lokalnie,
     * czy użytkownik jest autorem.
     */

    const poll =
      pollsCache.find(
        item =>
          String(item.id) ===
          String(pollId)
      );


    if (!poll) {

      throw new Error(
        "Nie znaleziono ankiety."
      );

    }


    if (
      String(poll.author_id) !==
      String(userId)
    ) {

      throw new Error(
        "Tylko autor ankiety może ją usunąć."
      );

    }


    /*
     * Najpierw usuwamy głosy.
     *
     * Dzięki temu nie potrzebujemy
     * CASCADE w bazie.
     */

    const {
      error:
        votesDeleteError
    } =
      await supabaseClient
        .from("votes")
        .delete()
        .eq(
          "poll_id",
          pollId
        );


    if (
      votesDeleteError
    ) {

      throw votesDeleteError;

    }


    /*
     * Usuwamy odpowiedzi.
     */

    const {
      error:
        optionsDeleteError
    } =
      await supabaseClient
        .from("options")
        .delete()
        .eq(
          "poll_id",
          pollId
        );


    if (
      optionsDeleteError
    ) {

      throw optionsDeleteError;

    }


    /*
     * Na końcu usuwamy ankietę.
     */

    const {
      error:
        pollDeleteError
    } =
      await supabaseClient
        .from("polls")
        .delete()
        .eq(
          "id",
          pollId
        )
        .eq(
          "author_id",
          userId
        );


    if (
      pollDeleteError
    ) {

      throw pollDeleteError;

    }


    /*
     * Czyścimy lokalną informację
     * o głosowaniu w tej ankiecie.
     */

    const localVotes =
      getLocalVotes()
        .filter(
          id =>
            id !==
            String(pollId)
        );


    localStorage.setItem(
      "voted_polls",
      JSON.stringify(
        localVotes
      )
    );


    closeDeleteModal();


    showMessage(
      "Ankieta została usunięta.",
      "success"
    );


    await loadPolls();

  }

  catch (error) {

    console.error(
      "DELETE POLL ERROR:",
      error
    );


    showMessage(
      readableError(
        error
      )
    );

  }

  finally {

    button.disabled =
      false;

    button.textContent =
      "Usuń ankietę";

  }

}

/* =========================================================
   LICZBY
========================================================= */

function toSafeNumber(value) {

  const number = Number(value);

  if (
    !Number.isFinite(number) ||
    number < 0
  ) {
    return 0;
  }

  return Math.floor(number);
}


function pluralize(
  number,
  one,
  few,
  many
) {

  const n =
    Math.abs(Number(number));

  if (n === 1) {
    return one;
  }

  const lastTwo = n % 100;

  if (
    lastTwo >= 12 &&
    lastTwo <= 14
  ) {
    return many;
  }

  const last = n % 10;

  if (
    last >= 2 &&
    last <= 4
  ) {
    return few;
  }

  return many;
}

function readableError(error) {

  if (!error) {
    return "Wystąpił nieznany błąd.";
  }

  console.error(error);

  if (error.code === "23505") {
    return "Na tę ankietę został już oddany głos.";
  }

  if (error.code === "42501") {
    return "Operacja została zablokowana przez RLS w Supabase.";
  }

  if (error.code === "23503") {
    return "Operacja nie może zostać wykonana, ponieważ dane są ze sobą powiązane.";
  }

  return (
    error.message ||
    "Wystąpił nieznany błąd."
  );
}

        : [];


    /* -------------------------
       LICZNIKI
    ------------------------- */

    const pollVoteCounts =
      new Map();

    const optionVoteCounts =
      new Map();

    const currentUserVotes =
      new Set();


    safeVotes.forEach(vote => {

      const pollId =
        String(vote.poll_id);

      const optionId =
        String(vote.option_id);

      /* suma głosów ankiety */

      pollVoteCounts.set(
        pollId,
        (
          pollVoteCounts.get(pollId) || 0
        ) + 1
      );

      /* suma głosów odpowiedzi */

      optionVoteCounts.set(
        optionId,
        (
          optionVoteCounts.get(optionId) || 0
        ) + 1
      );

      /* głos aktualnego użytkownika */

      if (
        String(vote.user_id) ===
        String(userId)
      ) {

        currentUserVotes.add(
          pollId
        );

      }

    });


    /* -------------------------
       ŁĄCZENIE DANYCH
    ------------------------- */

    safePolls.forEach(poll => {

      const pollId =
        String(poll.id);

      const options =
        Array.isArray(poll.options)
          ? poll.options
          : [];

      poll.total_votes =
        pollVoteCounts.get(
          pollId
        ) || 0;

      poll.options =
        options.map(option => {

          const optionId =
            String(option.id);

          return {
            ...option,

            vote_count:
              optionVoteCounts.get(
                optionId
              ) || 0
          };

        });

    });


    pollsCache =
      safePolls;


    /* -------------------------
       LICZNIK ANKIET
    ------------------------- */

    document.getElementById(
      "pollCount"
    ).textContent =
      safePolls.length;


    /* -------------------------
       BRAK ANKIET
    ------------------------- */

    if (safePolls.length === 0) {

      container.innerHTML = `
        <div class="card empty">

          <div class="empty-icon">
            📊
          </div>

          <h3>
            Brak ankiet
          </h3>

          <p>
            Utwórz pierwszą ankietę powyżej.
          </p>

        </div>
      `;

      return;
    }


    /* -------------------------
       RENDER
    ------------------------- */

    container.innerHTML = "";

    safePolls.forEach(poll => {

      /*
       * Bierzemy informację o głosie
       * bezpośrednio z tabeli votes.
       *
       * LocalStorage służy tylko jako
       * dodatkowa pamięć przeglądarki.
       */

      const voted =
        currentUserVotes.has(
          String(poll.id)
        ) ||
        hasLocalVote(poll.id);

      renderPoll(
        poll,
        voted
      );

    });

  }

  catch (error) {

    console.error(
      "LOAD POLLS ERROR:",
      error
    );

    document.getElementById(
      "pollCount"
    ).textContent = "0";

    container.innerHTML = `
      <div class="card empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <h3>
          Nie udało się załadować ankiet
        </h3>

        <p>
          ${escapeHtml(
            readableError(error)
          )}
        </p>

        <button
          class="retry-button"
          type="button"
          onclick="loadPolls()"
        >
          Spróbuj ponownie
        </button>

      </div>
    `;

  }

  finally {

    isLoading = false;

  }

}


/* =========================================================
   RENDER ANKIETY
========================================================= */

function renderPoll(
  poll,
  hasVoted
) {

  const container =
    document.getElementById("polls");

  const card =
    document.createElement("article");

  card.className =
    "card poll";


  /* -------------------------
     GÓRA
  ------------------------- */

  const top =
    document.createElement("div");

  top.className =
    "poll-top";


  const question =
    document.createElement("h2");

  question.className =
    "question";

  question.textContent =
    poll.question;

  top.appendChild(question);


  /* -------------------------
     USUWANIE PRZEZ AUTORA
  ------------------------- */

  if (
    String(poll.author_id) ===
    String(userId)
  ) {

    const deleteButton =
      document.createElement("button");

    deleteButton.type =
      "button";

    deleteButton.className =
      "delete-button";

    deleteButton.textContent =
      "🗑️ Usuń";

    deleteButton.addEventListener(
      "click",
      () => {

        openDeleteModal(
          poll.id
        );

      }
    );

    top.appendChild(
      deleteButton
    );

  }


  card.appendChild(top);


  /* -------------------------
     OPCJE
  ------------------------- */

  const options =
    Array.isArray(poll.options)
      ? poll.options
      : [];


  /* -------------------------
     CAŁKOWITA LICZBA GŁOSÓW
  ------------------------- */

  const totalVotes =
    options.reduce(
      (sum, option) => {

        return sum +
          toSafeNumber(
            option.vote_count
          );

      },
      0
    );


  /*
   * To jest celowo liczone
   * ponownie z odpowiedzi.
   *
   * Dzięki temu suma procentów
   * bazuje dokładnie na tych samych
   * liczbach, które są wyświetlane.
   */

  poll.total_votes =
    totalVotes;


  /* -------------------------
     META
  ------------------------- */

  const meta =
    document.createElement("div");

  meta.className =
    "meta";


  const dateBadge =
    document.createElement("span");

  dateBadge.className =
    "badge";


  let dateText =
    "brak daty";

  if (poll.created_at) {

    const date =
      new Date(
        poll.created_at
      );

    if (
      !Number.isNaN(
        date.getTime()
      )
    ) {

      dateText =
        date.toLocaleDateString(
          "pl-PL"
        );

    }

  }


  dateBadge.textContent =
    "📅 " + dateText;

  meta.appendChild(
    dateBadge
  );


  const votesBadge =
    document.createElement("span");

  votesBadge.className =
    "badge";

  votesBadge.textContent =
    "🗳️ " +
    totalVotes +
    " " +
    pluralize(
      totalVotes,
      "głos",
      "głosy",
      "głosów"
    );

  meta.appendChild(
    votesBadge
  );


  if (hasVoted) {

    const votedBadge =
      document.createElement("span");

    votedBadge.className =
      "badge voted";

    votedBadge.textContent =
      "✓ Zagłosowano";

    meta.appendChild(
      votedBadge
    );

  }


  card.appendChild(meta);


  /* -------------------------
     ODPOWIEDZI
  ------------------------- */

  options.forEach(
    (option, index) => {

      const row =
        document.createElement("div");

      row.className =
        "option";


      const optionVotes =
        toSafeNumber(
          option.vote_count
        );


      /*
       * Procent jest liczony:
       *
       * głosy odpowiedzi
       * ---------------- × 100
       * wszystkie głosy
       */

      let percentage = 0;

      if (totalVotes > 0) {

        percentage =
          Math.round(
            (
              optionVotes /
              totalVotes
            ) * 100
          );

      }


      percentage =
        Math.max(
          0,
          Math.min(
            100,
            percentage
          )
        );


      /* -------------------------
         PRZYCISK
      ------------------------- */

      const button =
        document.createElement("button");

      button.type =
        "button";

      button.className =
        "vote-button";


      if (hasVoted) {

        button.disabled =
          true;

      }


      /* -------------------------
         PASEK
      ------------------------- */

      const progress =
        document.createElement("div");

      progress.className =
        "progress";

      progress.style.width =
        percentage + "%";

      button.appendChild(
        progress
      );


      /* -------------------------
         TREŚĆ
      ------------------------- */

      const content =
        document.createElement("div");

      content.className =
        "vote-content";


      const optionText =
        document.createElement("span");

      optionText.className =
        "option-text";

      optionText.textContent =
        option.text;


      const percent =
        document.createElement("span");

      percent.className =
        "percent";

      percent.textContent =
        percentage + "%";


      content.appendChild(
        optionText
      );

      content.appendChild(
        percent
      );

      button.appendChild(
        content
      );


      /* -------------------------
         GŁOSOWANIE
      ------------------------- */

      if (!hasVoted) {

        button.addEventListener(
          "click",
          () => {

            vote(
              poll.id,
              option.id
            );

          }
        );

      }


      row.appendChild(
        button
      );


      /* -------------------------
         INFORMACJE
      ------------------------- */

      const info =
        document.createElement("div");

      info.className =
        "option-info";


      const voteText =
        document.createElement("span");

      voteText.textContent =
        optionVotes +
        " " +
        pluralize(
          optionVotes,
          "głos",
          "głosy",
          "głosów"
        );


      const answerText =
        document.createElement("span");

      answerText.textContent =
        "Odpowiedź " +
        (index + 1);


      info.appendChild(
        voteText
      );

      info.appendChild(
        answerText
      );


      row.appendChild(
        info
      );

      card.appendChild(
        row
      );

    }
  );


  container.appendChild(
    card
  );

}


/* =========================================================
   GŁOSOWANIE
========================================================= */

async function vote(
  pollId,
  optionId
) {

  if (
    hasLocalVote(pollId)
  ) {

    showMessage(
      "Na tę ankietę już głosowałeś."
    );

    await loadPolls();

    return;
  }


  const poll =
    pollsCache.find(
      item =>
        String(item.id) ===
        String(pollId)
    );


  if (!poll) {

    showMessage(
      "Nie znaleziono ankiety."
    );

    return;
  }


  /*
   * Sprawdzamy, czy odpowiedź
   * faktycznie należy do tej ankiety.
   */

  const optionExists =
    Array.isArray(poll.options) &&
    poll.options.some(
      option =>
        String(option.id) ===
        String(optionId)
    );


  if (!optionExists) {

    showMessage(
      "Wybrana odpowiedź nie należy do tej ankiety."
    );

    return;
  }


  try {

    /*
     * Blokujemy przyciski tylko podczas
     * wykonywania operacji.
     */

    document
      .querySelectorAll(
        ".vote-button"
      )
      .forEach(button => {

        button.disabled = true;

      });


    /*
     * Wstawiamy JEDEN rekord.
     */

    const {
      error
    } =
      await supabaseClient
        .from("votes")
        .insert({
          poll_id: pollId,
          option_id: optionId,
          user_id: userId
        });


    if (error) {

      if (
        error.code === "23505"
      ) {

        rememberLocalVote(
          pollId
        );

        showMessage(
          "Na tę ankietę już głosowałeś."
        );

        await loadPolls();

        return;
      }

      throw error;
    }


    rememberLocalVote(
      pollId
    );


    showMessage(
      "Głos został zapisany!",
      "success"
    );


    await loadPolls();

  }

  catch (error) {

    console.error(
      "VOTE ERROR:",
      error
    );

    showMessage(
      readableError(error)
    );

    await loadPolls();

  }

}


/* =========================================================
   TWORZENIE ANKIETY
========================================================= */

async function createPoll() {

  const button =
    document.getElementById(
      "createButton"
    );


  const question =
    document
      .getElementById("question")
      .value
      .trim();


  const options = [

    document
      .getElementById("option1")
      .value
      .trim(),

    document
      .getElementById("option2")
      .value
      .trim(),

    document
      .getElementById("option3")
      .value
      .trim(),

    document
      .getElementById("option4")
      .value
      .trim()

  ].filter(Boolean);


  if (!question) {

    showMessage(
      "Wpisz pytanie ankiety."
    );

    return;
  }


  if (options.length < 2) {

    showMessage(
      "Dodaj przynajmniej 2 odpowiedzi."
    );

    return;
  }


  const normalized =
    options.map(
      option =>
        option.toLowerCase()
    );


  if (
    new Set(normalized).size !==
    options.length
  ) {

    showMessage(
      "Odpowiedzi w jednej ankiecie muszą być różne."
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "Tworzenie...";


  let createdPollId = null;


  try {

    /* -------------------------
       ANKIETA
    ------------------------- */

    const {
      data: poll,
      error: pollError
    } =
      await supabaseClient
        .from("polls")
        .insert({
          question: question,
          author_id: userId
        })
        .select("id")
        .single();


    if (pollError) {
      throw pollError;
    }


    if (!poll || !poll.id) {

      throw new Error(
        "Nie udało się uzyskać ID ankiety."
      );

    }


    createdPollId =
      poll.id;


    /* -------------------------
       ODPOWIEDZI
    ------------------------- */

    const optionRows =
      options.map(text => ({
        poll_id: poll.id,
        text: text
      }));


    const {
      error: optionsError
    } =
      await supabaseClient
        .from("options")
        .insert(
          optionRows
        );


    if (optionsError) {

      /*
       * Spróbuj posprzątać,
       * jeżeli odpowiedzi się nie utworzyły.
       */

      await supabaseClient
        .from("polls")
        .delete()
        .eq(
          "id",
          createdPollId
        )
        .eq(
          "author_id",
          userId
        );

      throw optionsError;
    }


    /* -------------------------
       CZYSZCZENIE
    ------------------------- */

    [
      "question",
      "option1",
      "option2",
      "option3",
      "option4"
    ].forEach(id => {

      document.getElementById(
        id
      ).value = "";

    });


    showMessage(
      "Ankieta została utworzona!",
      "success"
    );


    await loadPolls();

  }

  catch (error) {

    console.error(
      "CREATE POLL ERROR:",
      error
    );

    showMessage(
      readableError(error)
    );

  }

  finally {

    butto  finally {

    button.disabled = false;

    button.textContent =
      "＋ Utwórz ankietę";

  }

}


/* =========================================================
   USUWANIE — MODAL
========================================================= */

function openDeleteModal(pollId) {

  pollToDelete = pollId;

  document
    .getElementById("deleteModal")
    .classList.add("show");

}


function closeDeleteModal() {

  pollToDelete = null;

  document
    .getElementById("deleteModal")
    .classList.remove("show");

}


/* =========================================================
   USUWANIE ANKIETY
========================================================= */

async function deletePoll() {

  if (pollToDelete === null) {
    return;
  }

  const pollId = pollToDelete;

  const button =
    document.getElementById(
      "confirmDeleteButton"
    );

  button.disabled = true;

  button.textContent =
    "Usuwanie...";

  try {

    /* -------------------------
       SPRAWDZENIE AUTORA
    ------------------------- */

    const poll =
      pollsCache.find(
        item =>
          String(item.id) ===
          String(pollId)
      );

    if (!poll) {

      throw new Error(
        "Nie znaleziono ankiety."
      );

    }

    if (
      String(poll.author_id) !==
      String(userId)
    ) {

      throw new Error(
        "Tylko autor ankiety może ją usunąć."
      );

    }


    /* -------------------------
       USUNIĘCIE GŁOSÓW
    ------------------------- */

    const {
      error: votesError
    } =
      await supabaseClient
        .from("votes")
        .delete()
        .eq(
          "poll_id",
          pollId
        );

    if (votesError) {
      throw votesError;
    }


    /* -------------------------
       USUNIĘCIE ODPOWIEDZI
    ------------------------- */

    const {
      error: optionsError
    } =
      await supabaseClient
        .from("options")
        .delete()
        .eq(
          "poll_id",
          pollId
        );

    if (optionsError) {
      throw optionsError;
    }


    /* -------------------------
       USUNIĘCIE ANKIETY
    ------------------------- */

    const {
      error: pollError
    } =
      await supabaseClient
        .from("polls")
        .delete()
        .eq(
          "id",
          pollId
        )
        .eq(
          "author_id",
          userId
        );

    if (pollError) {
      throw pollError;
    }


    /* -------------------------
       LOCAL STORAGE
    ------------------------- */

    const remainingVotes =
      getLocalVotes().filter(
        id =>
          String(id) !==
          String(pollId)
      );

    localStorage.setItem(
      "voted_polls",
      JSON.stringify(
        remainingVotes
      )
    );


    closeDeleteModal();


    showMessage(
      "Ankieta została usunięta.",
      "success"
    );


    await loadPolls();

  }

  catch (error) {

    console.error(
      "DELETE POLL ERROR:",
      error
    );

    showMessage(
      readableError(error)
    );

  }

  finally {

    button.disabled = false;

    button.textContent =
      "Usuń ankietę";

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  const div =
    document.createElement("div");

  div.textContent =
    String(value ?? "");

  return div.innerHTML;

}


/* =========================================================
   MODAL
========================================================= */

document
  .getElementById(
    "cancelDeleteButton"
  )
  .addEventListener(
    "click",
    closeDeleteModal
  );


document
  .getElementById(
    "confirmDeleteButton"
  )
  .addEventListener(
    "click",
    deletePoll
  );


document
  .getElementById(
    "deleteModal"
  )
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id ===
        "deleteModal"
      ) {

        closeDeleteModal();

      }

    }
  );


document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      closeDeleteModal();

    }

  }
);


/* =========================================================
   PRZYCISK TWORZENIA
========================================================= */

document
  .getElementById(
    "createButton"
  )
  .addEventListener(
    "click",
    createPoll
  );


/* =========================================================
   ENTER W FORMULARZU
========================================================= */

[
  "question",
  "option1",
  "option2",
  "option3",
  "option4"
].forEach(id => {

  document
    .getElementById(id)
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          createPoll();

        }

      }
    );

});


/* =========================================================
   START
========================================================= */

loadPolls();

</script>
