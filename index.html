<!DOCTYPE html>
<html lang="pl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Głosowanie</title>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
    }

    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, .08);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
      margin-top: 8px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .create-button {
      width: 100%;
      margin-top: 12px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
    }

    .option button {
      flex: 1;
      text-align: left;
      margin: 0;
    }

    .votes {
      min-width: 80px;
      color: #4b5563;
      font-size: 14px;
      text-align: right;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 30px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .poll-title {
      margin-top: 0;
    }

    .loading {
      text-align: center;
      color: #6b7280;
      padding: 20px;
    }

    @media (max-width: 600px) {

      .option {
        flex-direction: column;
        align-items: stretch;
      }

      .votes {
        text-align: left;
      }

    }

  </style>

</head>


<body>

<header>

  <h1>🗳️ Głosowanie</h1>

  <p>
    Twórz ankiety i głosuj razem z innymi
  </p>

</header>


<main>

  <div id="message"></div>


  <!-- TWORZENIE ANKIETY -->

  <div class="box">

    <h2>➕ Utwórz ankietę</h2>

    <input
      id="question"
      type="text"
      maxlength="200"
      placeholder="Wpisz pytanie ankiety"
    >

    <input
      id="option1"
      type="text"
      maxlength="100"
      placeholder="Odpowiedź A"
    >

    <input
      id="option2"
      type="text"
      maxlength="100"
      placeholder="Odpowiedź B"
    >

    <input
      id="option3"
      type="text"
      maxlength="100"
      placeholder="Odpowiedź C"
    >

    <input
      id="option4"
      type="text"
      maxlength="100"
      placeholder="Odpowiedź D"
    >

    <button
      id="createButton"
      class="create-button"
      onclick="createPoll()"
    >
      Utwórz ankietę
    </button>

  </div>


  <!-- ANKIETY -->

  <div id="polls">

    <div class="loading">
      Ładowanie ankiet...
    </div>

  </div>

</main>


<script>


/*
====================================================
SUPABASE
====================================================
*/

const SUPABASE_URL =
  "https://hvloevnsrbfmmrkohzxe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable__iN5fmthHgtL_WfMM08sUw_7PCFKJgl";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/*
====================================================
IDENTYFIKATOR UŻYTKOWNIKA
====================================================

Tworzymy identyfikator dla przeglądarki.

Dzięki temu:
- użytkownik dostaje stały ID,
- nie może oddać drugiego głosu
  w tej samej ankiecie,
- baza dodatkowo pilnuje UNIQUE(poll_id, user_id).
*/

function getUserId() {

  let userId =
    localStorage.getItem("voter_id");

  if (!userId) {

    userId =
      crypto.randomUUID();

    localStorage.setItem(
      "voter_id",
      userId
    );

  }

  return userId;
}


/*
====================================================
KOMUNIKATY
====================================================
*/

function showMessage(
  message,
  type = "error"
) {

  const container =
    document.getElementById("message");

  container.innerHTML = `
    <div class="${type}">
      ${escapeHtml(message)}
    </div>
  `;

  setTimeout(() => {

    container.innerHTML = "";

  }, 4000);
}


/*
====================================================
WCZYTYWANIE ANKIET
====================================================
*/

async function loadPolls() {

  const container =
    document.getElementById("polls");

  container.innerHTML = `
    <div class="loading">
      Ładowanie ankiet...
    </div>
  `;


  const {
    data,
    error
  } =
    await supabaseClient

      .from("polls")

      .select(`
        id,
        question,
        created_at,
        options (
          id,
          text,
          votes
        )
      `)

      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "Błąd ładowania:",
      error
    );

    container.innerHTML = `
      <div class="box error">
        Nie udało się wczytać ankiet.
      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML = `
      <div class="box empty">

        <h2>Brak ankiet</h2>

        <p>
          Nie ma jeszcze żadnych ankiet.
          Utwórz pierwszą!
        </p>

      </div>
    `;

    return;
  }


  container.innerHTML = "";


  data.forEach(poll => {

    const box =
      document.createElement("div");

    box.className = "box";


    const title =
      document.createElement("h2");

    title.className = "poll-title";

    title.textContent =
      poll.question;


    box.appendChild(title);


    if (
      !poll.options ||
      poll.options.length === 0
    ) {

      const empty =
        document.createElement("p");

      empty.textContent =
        "Brak odpowiedzi.";

      box.appendChild(empty);

      container.appendChild(box);

      return;
    }


    poll.options.forEach(option => {

      const row =
        document.createElement("div");

      row.className = "option";


      const button =
        document.createElement("button");

      button.textContent =
        option.text;


      button.onclick =
        () => vote(
          poll.id,
          option.id,
          button
        );


      const votes =
        document.createElement("span");

      votes.className = "votes";

      votes.textContent =
        `${option.votes || 0} głosów`;


      row.appendChild(button);

      row.appendChild(votes);

      box.appendChild(row);

    });


    container.appendChild(box);

  });

}


/*
====================================================
TWORZENIE ANKIETY
====================================================
*/

async function createPoll() {

  const button =
    document.getElementById(
      "createButton"
    );


  const question =
    document
      .getElementById("question")
      .value
      .trim();


  const options = [

    document
      .getElementById("option1")
      .value
      .trim(),

    document
      .getElementById("option2")
      .value
      .trim(),

    document
      .getElementById("option3")
      .value
      .trim(),

    document
      .getElementById("option4")
      .value
      .trim()

  ].filter(Boolean);


  /*
  WALIDACJA
  */

  if (!question) {

    showMessage(
      "Wpisz pytanie."
    );

    return;
  }


  if (options.length < 2) {

    showMessage(
      "Dodaj przynajmniej 2 odpowiedzi."
    );

    return;
  }


  /*
  BLOKUJEMY PRZYCISK
  */

  button.disabled = true;

  button.textContent =
    "Tworzenie...";


  try {

    /*
    TWORZYMY ANKIETĘ
    */

    const {
      data,
      error
    } =
      await supabaseClient

        .from("polls")

        .insert({
          question: question
        })

        .select()

        .single();


    if (error) {

      console.error(error);

      throw new Error(
        error.message
      );
    }


    /*
    TWORZYMY ODPOWIEDZI
    */

    const optionRows =
      options.map(text => ({

        poll_id:
          data.id,

        text:
          text,

        votes:
          0

      }));


    const {
      error: optionError
    } =
      await supabaseClient

        .from("options")

        .insert(optionRows);


    if (optionError) {

      console.error(
        optionError
      );

      throw new Error(
        optionError.message
      );
    }


    /*
    CZYSZCZENIE FORMULARZA
    */

    document
      .getElementById("question")
      .value = "";


    document
      .getElementById("option1")
      .value = "";


    document
      .getElementById("option2")
      .value = "";


    document
      .getElementById("option3")
      .value = "";


    document
      .getElementById("option4")
      .value = "";


    showMessage(
      "Ankieta została utworzona.",
      "success"
    );


    await loadPolls();

  }

  catch (error) {

    console.error(
      "Błąd tworzenia ankiety:",
      error
    );

    showMessage(
      error.message ||
      "Nie udało się utworzyć ankiety."
    );

  }

  finally {

    button.disabled = false;

    button.textContent =
      "Utwórz ankietę";

  }

}


/*
====================================================
GŁOSOWANIE
====================================================
*/

async function vote(
  pollId,
  optionId,
  button
) {

  /*
  Zabezpieczenie przed
  wielokrotnym kliknięciem.
  */

  button.disabled = true;

  button.textContent =
    "Głosowanie...";


  const userId =
    getUserId();


  try {

    /*
    GŁOS JEST DODAWANY PRZEZ
    FUNKCJĘ SQL.

    Funkcja:
    - sprawdza, czy użytkownik już głosował,
    - sprawdza poprawność odpowiedzi,
    - zapisuje głos,
    - zwiększa licznik atomowo.
    */

    const {
      error
    } =
      await supabaseClient

        .rpc(
          "add_vote",
          {
            p_poll_id:
              pollId,

            p_option_id:
              optionId,

            p_user_id:
              userId
          }
        );


    if (error) {

      console.error(
        "Błąd głosowania:",
        error
      );


      /*
      Użytkownik już głosował.
      */

      if (
        error.message
          .includes("ALREADY_VOTED")
      ) {

        showMessage(
          "Na tę ankietę już głosowałeś."
        );

      }

      else if (
        error.message
          .includes("INVALID_OPTION")
      ) {

        showMessage(
          "Wybrana odpowiedź jest nieprawidłowa."
        );

      }

      else {

        showMessage(
          error.message ||
          "Nie udało się oddać głosu."
        );

      }


      return;
    }


    /*
    SUKCES
    */

    showMessage(
      "Twój głos został zapisany.",
      "success"
    );


    await loadPolls();

  }

  catch (error) {

    console.error(error);

    showMessage(
      "Wystąpił błąd podczas głosowania."
    );

  }

  finally {

    button.disabled = false;

  }

}


/*
====================================================
BEZPIECZNE WYŚWIETLANIE TEKSTU
====================================================
*/

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/*
====================================================
START
====================================================
*/

getUserId();

loadPolls();


</script>

</body>

</html>
