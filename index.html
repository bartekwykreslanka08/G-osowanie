<!DOCTYPE html>
<html lang="pl">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Głosowanie</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --danger: #dc2626;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    /* HEADER */

    header {
      padding: 55px 20px 90px;
      color: white;
      text-align: center;
      background:
        linear-gradient(
          135deg,
          #111827,
          #312e81,
          #4f46e5
        );
    }

    header .icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      background:
        rgba(255,255,255,.14);

      font-size: 34px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(36px, 8vw, 60px);
    }

    header p {
      max-width: 600px;
      margin: 14px auto 0;
      color: rgba(255,255,255,.78);
      line-height: 1.6;
    }

    /* MAIN */

    main {
      width: min(900px, calc(100% - 28px));
      margin: -45px auto 50px;
    }

    .card {
      background: var(--card);
      border-radius: 22px;
      box-shadow:
        0 10px 35px rgba(15,23,42,.08);
    }

    /* CREATE */

    .create {
      padding: 26px;
      margin-bottom: 30px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 22px;
    }

    .title-icon {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      background: #eef2ff;
      color: var(--primary);

      font-size: 23px;
    }

    .title-row h2 {
      margin: 0;
      font-size: 22px;
    }

    .title-row p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      margin-bottom: 10px;

      border: 1px solid var(--border);
      border-radius: 12px;

      outline: none;

      transition: .2s;
    }

    input:focus {
      border-color: #818cf8;

      box-shadow:
        0 0 0 4px
        rgba(99,102,241,.12);
    }

    .label {
      display: block;
      margin: 10px 0 9px;

      color: #374151;

      font-size: 13px;
      font-weight: bold;
    }

    .create-button {
      width: 100%;
      padding: 14px;

      border: 0;
      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #4f46e5,
          #6366f1
        );

      color: white;

      font-weight: bold;

      cursor: pointer;

      transition: .2s;
    }

    .create-button:hover {
      transform: translateY(-1px);
    }

    .create-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    /* MESSAGE */

    #message {
      margin-bottom: 15px;
    }

    .message {
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .message.success {
      color: #166534;
      background: #dcfce7;
    }

    .message.error {
      color: #991b1b;
      background: #fee2e2;
    }

    /* POLLS HEADER */

    .polls-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin: 0 3px 15px;
    }

    .polls-header h2 {
      margin: 0;
      font-size: 22px;
    }

    .count {
      padding: 6px 11px;

      border-radius: 999px;

      background: #e0e7ff;
      color: #4338ca;

      font-size: 12px;
      font-weight: bold;
    }

    /* POLL */

    .poll {
      padding: 24px;
      margin-bottom: 17px;
    }

    .poll-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 15px;
    }

    .question {
      margin: 0;

      font-size: 21px;
      line-height: 1.4;

      overflow-wrap: anywhere;
    }

    .delete {
      flex-shrink: 0;

      padding: 8px 11px;

      border: 1px solid #fecaca;
      border-radius: 9px;

      background: white;
      color: var(--danger);

      font-size: 12px;
      font-weight: bold;

      cursor: pointer;
    }

    .delete:hover {
      background: #fef2f2;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;

      margin: 10px 0 20px;
    }

    .badge {
      padding: 5px 8px;

      border-radius: 7px;

      background: #f3f4f6;

      color: var(--muted);

      font-size: 12px;
    }

    .badge.voted {
      background: #dcfce7;
      color: #166534;
    }

    /* OPTIONS */

    .option {
      margin: 12px 0;
    }

    .vote {
      position: relative;
      overflow: hidden;

      width: 100%;
      min-height: 52px;

      padding: 14px 15px;

      border: 1px solid var(--border);
      border-radius: 12px;

      background: white;

      text-align: left;

      cursor: pointer;

      transition: .2s;
    }

    .vote:hover:not(:disabled) {
      border-color: #818cf8;
      transform: translateY(-1px);
    }

    .vote:disabled {
      cursor: default;
    }

    .progress {
      position: absolute;
      inset: 0 auto 0 0;

      width: 0;

      background: #eef2ff;

      transition: width .5s;
    }

    .vote-content {
      position: relative;
      z-index: 2;

      display: flex;
      justify-content: space-between;

      gap: 10px;

      font-weight: 600;
    }

    .option-text {
      overflow-wrap: anywhere;
    }

    .percent {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .option-info {
      display: flex;
      justify-content: space-between;

      padding: 5px 4px 0;

      color: var(--muted);

      font-size: 12px;
    }

    /* EMPTY */

    .empty {
      padding: 55px 20px;
      text-align: center;
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .empty h3 {
      margin: 0 0 7px;
    }

    .empty p {
      margin: 0;
      color: var(--muted);
    }

    /* LOADING */

    .loading {
      padding: 50px;
      text-align: center;
      color: var(--muted);
    }

    .spinner {
      width: 30px;
      height: 30px;

      margin: 0 auto 12px;

      border: 3px solid #e5e7eb;
      border-top-color: var(--primary);

      border-radius: 50%;

      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(15,23,42,.55);

      backdrop-filter: blur(4px);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(420px,100%);

      padding: 25px;

      border-radius: 20px;

      background: white;

      box-shadow:
        0 25px 70px
        rgba(0,0,0,.25);
    }

    .modal-box h3 {
      margin: 0 0 8px;
    }

    .modal-box p {
      margin: 0;

      color: var(--muted);

      line-height: 1.5;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;

      margin-top: 22px;
    }

    .modal-buttons button {
      flex: 1;

      padding: 12px;

      border-radius: 10px;

      cursor: pointer;

      font-weight: bold;
    }

    .cancel {
      border: 1px solid var(--border);
      background: white;
    }

    .confirm {
      border: 0;
      background: var(--danger);
      color: white;
    }

    /* FOOTER */

    footer {
      padding: 20px;

      text-align: center;

      color: #9ca3af;

      font-size: 12px;
    }

    /* MOBILE */

    @media(max-width:600px) {

      header {
        padding: 40px 18px 75px;
      }

      main {
        width: calc(100% - 20px);
      }

      .create,
      .poll {
        padding: 19px;
      }

      .poll-top {
        flex-direction: column;
      }

      .delete {
        align-self: flex-end;
      }

      .question {
        font-size: 19px;
      }

      .modal-buttons {
        flex-direction: column-reverse;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="icon">
    🗳️
  </div>

  <h1>Głosowanie</h1>

  <p>
    Twórz ankiety, głosuj i sprawdzaj
    wyniki w czasie rzeczywistym.
  </p>

</header>


<main>


  <div id="message"></div>


  <!-- TWORZENIE -->

  <section class="card create">

    <div class="title-row">

      <div class="title-icon">
        ＋
      </div>

      <div>

        <h2>Nowa ankieta</h2>

        <p>
          Utwórz pytanie i dodaj odpowiedzi.
        </p>

      </div>

    </div>


    <input
      id="question"
      maxlength="200"
      placeholder="Wpisz pytanie ankiety"
    >


    <span class="label">
      Odpowiedzi
    </span>


    <input
      id="option1"
      maxlength="100"
      placeholder="Odpowiedź A"
    >

    <input
      id="option2"
      maxlength="100"
      placeholder="Odpowiedź B"
    >

    <input
      id="option3"
      maxlength="100"
      placeholder="Odpowiedź C — opcjonalnie"
    >

    <input
      id="option4"
      maxlength="100"
      placeholder="Odpowiedź D — opcjonalnie"
    >


    <button
      id="createButton"
      class="create-button"
      onclick="createPoll()"
    >
      ＋ Utwórz ankietę
    </button>

  </section>


  <!-- ANKIETY -->

  <div class="polls-header">

    <h2>
      📊 Ankiety
    </h2>

    <span
      id="pollCount"
      class="count"
    >
      0
    </span>

  </div>


  <div id="polls">

    <div class="card loading">

      <div class="spinner"></div>

      Ładowanie ankiet...

    </div>

  </div>


</main>


<footer>
  Głosowanie
</footer>


<!-- MODAL USUWANIA -->

<div
  id="deleteModal"
  class="modal"
>

  <div class="modal-box">

    <h3>
      Usunąć ankietę?
    </h3>

    <p>
      Ankieta, odpowiedzi i głosy zostaną
      usunięte. Tej operacji nie można cofnąć.
    </p>


    <div class="modal-buttons">

      <button
        class="cancel"
        onclick="closeDeleteModal()"
      >
        Anuluj
      </button>

      <button
        id="confirmDelete"
        class="confirm"
        onclick="deletePoll()"
      >
        Usuń
      </button>

    </div>

  </div>

</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://hvloevnsrbfmmrkohzxe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable__iN5fmthHgtL_WfMM08sUw_7PCFKJgl";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   IDENTYFIKATOR
===================================================== */

function getUserId() {

  let id =
    localStorage.getItem(
      "voter_id"
    );


  if (!id) {

    id =
      crypto.randomUUID();

    localStorage.setItem(
      "voter_id",
      id
    );

  }


  return id;
}


const userId =
  getUserId();


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type = "error"
) {

  const box =
    document.getElementById(
      "message"
    );


  box.innerHTML = "";


  const message =
    document.createElement(
      "div"
    );


  message.className =
    `message ${type}`;


  message.textContent =
    text;


  box.appendChild(
    message
  );


  setTimeout(() => {

    box.innerHTML = "";

  }, 4500);

}


/* =====================================================
   LOAD POLLS
===================================================== */

async function loadPolls() {

  const container =
    document.getElementById(
      "polls"
    );


  container.innerHTML = `
    <div class="card loading">
      <div class="spinner"></div>
      Ładowanie ankiet...
    </div>
  `;


  try {

    /*
     WAŻNE:

     Nie pobieramy tutaj tabeli votes.

     Dzięki temu RLS na votes nie może
     zablokować całego ekranu.
    */

    const {
      data: polls,
      error: pollsError
    } =
      await supabaseClient

        .from("polls")

        .select(`
          id,
          question,
          created_at,
          author_id,
          options (
            id,
            text,
            votes
          )
        `)

        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (pollsError) {

      throw pollsError;

    }


    /*
     Osobne RPC do informacji,
     gdzie aktualny użytkownik już głosował.
    */

    const {
      data: votedRows,
      error: votedError
    } =
      await supabaseClient

        .rpc(
          "get_voted_polls",
          {
            p_user_id:
              userId
          }
        );


    if (votedError) {

      throw votedError;

    }


    const votedPolls =
      new Set(
        (votedRows || [])
          .map(row =>
            Number(row.poll_id)
          )
      );


    document.getElementById(
      "pollCount"
    ).textContent =
      polls.length;


    if (!polls.length) {

      container.innerHTML = `
        <div class="card empty">

          <div class="empty-icon">
            📊
          </div>

          <h3>
            Brak ankiet
          </h3>

          <p>
            Utwórz pierwszą ankietę powyżej.
          </p>

        </div>
      `;

      return;

    }


    container.innerHTML = "";


    polls.forEach(
      poll => {

        renderPoll(
          poll,
          votedPolls.has(
            Number(poll.id)
          )
        );

      }
    );

  }

  catch (error) {

    console.error(
      "LOAD POLLS ERROR:",
      error
    );


    container.innerHTML = `
      <div class="card empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <h3>
          Nie udało się załadować ankiet
        </h3>

        <p>
          ${escapeHtml(
            error.message ||
            "Nieznany błąd"
          )}
        </p>

      </div>
    `;

  }

}


/* =====================================================
   RENDER POLL
===================================================== */

function renderPoll(
  poll,
  hasVoted
) {

  const container =
    document.getElementById(
      "polls"
    );


  const card =
    document.createElement(
      "article"
    );


  card.className =
    "card poll";


  const top =
    document.createElement(
      "div"
    );


  top.className =
    "poll-top";


  const question =
    document.createElement(
      "h2"
    );


  question.className =
    "question";


  question.textContent =
    poll.question;


  top.appendChild(
    question
  );


  /*
   Tylko autor dostaje
   przycisk usuwania.
  */

  if (
    poll.author_id === userId
  ) {

    const deleteButton =
      document.createElement(
        "button"
      );


    deleteButton.className =
      "delete";


    deleteButton.textContent =
      "🗑️ Usuń";


    deleteButton.onclick =
      () => openDeleteModal(
        poll.id
      );


    top.appendChild(
      deleteButton
    );

  }


  card.appendChild(
    top
  );


  /* META */

  const options =
    poll.options || [];


  const totalVotes =
    options.reduce(
      (sum, option) =>
        sum +
        Number(option.votes || 0),
      0
    );


  const meta =
    document.createElement(
      "div"
    );


  meta.className =
    "meta";


  const date =
    new Date(
      poll.created_at
    ).toLocaleDateString(
      "pl-PL"
    );


  const dateBadge =
    document.createElement(
      "span"
    );


  dateBadge.className =
    "badge";


  dateBadge.textContent =
    `📅 ${date}`;


  meta.appendChild(
    dateBadge
  );


  const voteBadge =
    document.createElement(
      "span"
    );


  voteBadge.className =
    "badge";


  voteBadge.textContent =
    `🗳️ ${totalVotes} ${
      pluralize(
        totalVotes,
        "głos",
        "głosy",
        "głosów"
      )
    }`;


  meta.appendChild(
    voteBadge
  );


  if (hasVoted) {

    const votedBadge =
      document.createElement(
        "span"
      );


    votedBadge.className =
      "badge voted";


    votedBadge.textContent =
      "✓ Zagłosowano";


    meta.appendChild(
      votedBadge
    );

  }


  card.appendChild(
    meta
  );


  /* OPTIONS */

  options.forEach(
    (option, index) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "option";


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "vote";


      button.disabled =
        hasVoted;


      const optionVotes =
        Number(
          option.votes || 0
        );


      const percentage =
        totalVotes > 0
          ? Math.round(
              optionVotes /
              totalVotes *
              100
            )
          : 0;


      const progress =
        document.createElement(
          "div"
        );


      progress.className =
        "progress";


      progress.style.width =
        `${percentage}%`;


      const content =
        document.createElement(
          "div"
        );


      content.className =
        "vote-content";


      const text =
        document.createElement(
          "span"
        );


      text.className =
        "option-text";


      text.textContent =
        option.text;


      const percent =
        document.createElement(
          "span"
        );


      percent.className =
        "percent";


      percent.textContent =
        `${percentage}%`;


      content.appendChild(
        text
      );


      content.appendChild(
        percent
      );


      button.appendChild(
        progress
      );


      button.appendChild(
        content
      );


      if (!hasVoted) {

        button.onclick =
          () => vote(
            poll.id,
            option.id
          );

      }


      row.appendChild(
        button
      );


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "option-info";


      info.innerHTML = `
        <span>
          ${optionVotes}
          ${pluralize(
            optionVotes,
            "głos",
            "głosy",
            "głosów"
          )}
        </span>

        <span>
          Odpowiedź ${index + 1}
        </span>
      `;


      row.appendChild(
        info
      );


      card.appendChild(
        row
      );

    }
  );


  container.appendChild(
    card
  );

}


/* =====================================================
   CREATE POLL
===================================================== */

async function createPoll() {

  const button =
    document.getElementById(
      "createButton"
    );


  const question =
    document
      .getElementById("question")
      .value
      .trim();


  const options = [

    document
      .getElementById("option1")
      .value
      .trim(),

    document
      .getElementById("option2")
      .value
      .trim(),

    document
      .getElementById("option3")
      .value
      .trim(),

    document
      .getElementById("option4")
      .value
      .trim()

  ].filter(Boolean);


  if (!question) {

    showMessage(
      "Wpisz pytanie ankiety."
    );

    return;

  }


  if (options.length < 2) {

    showMessage(
      "Dodaj przynajmniej 2 odpowiedzi."
    );

    return;

  }


  button.disabled =
    true;


    button.textContent = "Tworzenie...";

  try {

    /*
     * Tworzymy ankietę.
     * author_id zapisujemy jako identyfikator
     * przeglądarki użytkownika.
     */
    const {
      data: poll,
      error: pollError
    } = await supabaseClient
      .from("polls")
      .insert({
        question: question,
        author_id: userId
      })
      .select()
      .single();

    if (pollError) {
      throw pollError;
    }

    /*
     * Tworzymy odpowiedzi.
     */
    const optionRows = options.map(text => ({
      poll_id: poll.id,
      text: text,
      votes: 0
    }));

    const {
      error: optionError
    } = await supabaseClient
      .from("options")
      .insert(optionRows);

    if (optionError) {

      /*
       * Jeśli dodanie odpowiedzi się nie udało,
       * próbujemy usunąć utworzoną ankietę.
       */
      await supabaseClient
        .from("polls")
        .delete()
        .eq("id", poll.id);

      throw optionError;
    }

    /*
     * Czyścimy formularz.
     */
    document.getElementById("question").value = "";
    document.getElementById("option1").value = "";
    document.getElementById("option2").value = "";
    document.getElementById("option3").value = "";
    document.getElementById("option4").value = "";

    showMessage(
      "Ankieta została utworzona!",
      "success"
    );

    /*
     * Odświeżamy listę ankiet.
     */
    await loadPolls();

    /*
     * Przewijamy stronę do listy ankiet.
     */
    document.getElementById("polls").scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  } catch (error) {

    console.error(
      "CREATE POLL ERROR:",
      error
    );

    showMessage(
      error.message ||
      "Nie udało się utworzyć ankiety."
    );

  } finally {

    button.disabled = false;
    button.textContent = "＋ Utwórz ankietę";

  }

}


/* =====================================================
   VOTE
===================================================== */

async function vote(
  pollId,
  optionId
) {

  try {

    /*
     * Najpierw zapisujemy głos.
     *
     * UNIQUE(poll_id, user_id)
     * w tabeli votes powinien zabezpieczać
     * przed wielokrotnym głosowaniem.
     */
    const {
      error: voteError
    } = await supabaseClient
      .from("votes")
      .insert({
        poll_id: pollId,
        option_id: optionId,
        user_id: userId
      });

    if (voteError) {

      if (
        voteError.code === "23505"
      ) {

        showMessage(
          "Na tę ankietę już głosowałeś."
        );

        await loadPolls();

        return;
      }

      throw voteError;
    }


    /*
     * Pobieramy aktualną liczbę głosów.
     */
    const {
      data: option,
      error: optionError
    } = await supabaseClient
      .from("options")
      .select("votes")
      .eq("id", optionId)
      .single();

    if (optionError) {
      throw optionError;
    }


    /*
     * Zwiększamy liczbę głosów.
     */
    const {
      error: updateError
    } = await supabaseClient
      .from("options")
      .update({
        votes:
          Number(option.votes || 0) + 1
      })
      .eq("id", optionId);

    if (updateError) {
      throw updateError;
    }


    showMessage(
      "Twój głos został zapisany!",
      "success"
    );


    await loadPolls();

  } catch (error) {

    console.error(
      "VOTE ERROR:",
      error
    );

    showMessage(
      error.message ||
      "Nie udało się oddać głosu."
    );

  }

}


/* =====================================================
   DELETE MODAL
===================================================== */

let pollToDelete = null;


function openDeleteModal(
  pollId
) {

  pollToDelete =
    pollId;


  document
    .getElementById("deleteModal")
    .classList.add("show");

}


function closeDeleteModal() {

  pollToDelete =
    null;


  document
    .getElementById("deleteModal")
    .classList.remove("show");

}


/* =====================================================
   DELETE POLL
===================================================== */

async function deletePoll() {

  if (
    pollToDelete === null
  ) {
    return;
  }


  const button =
    document.getElementById(
      "confirmDelete"
    );


  const id =
    pollToDelete;


  button.disabled =
    true;


  button.textContent =
    "Usuwanie...";


  try {

    /*
     * RLS w Supabase powinien pozwalać
     * na DELETE tylko wtedy, gdy:
     *
     * author_id = aktualny userId
     */
    const {
      error
    } = await supabaseClient
      .from("polls")
      .delete()
      .eq("id", id)
      .eq("author_id", userId);


    if (error) {
      throw error;
    }


    closeDeleteModal();


    showMessage(
      "Ankieta została usunięta.",
      "success"
    );


    await loadPolls();

  } catch (error) {

    console.error(
      "DELETE POLL ERROR:",
      error
    );

    showMessage(
      error.message ||
      "Nie udało się usunąć ankiety."
    );

  } finally {

    button.disabled =
      false;

    button.textContent =
      "Usuń";

  }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text ?? "";

  return div.innerHTML;

}


/* =====================================================
   LICZBA GŁOSÓW
===================================================== */

function pluralize(
  number,
  one,
  few,
  many
) {

  number =
    Math.abs(
      Number(number)
    );


  if (number === 1) {
    return one;
  }


  const lastTwo =
    number % 100;


  const last =
    number % 10;


  if (
    last >= 2 &&
    last <= 4 &&
    !(
      lastTwo >= 12 &&
      lastTwo <= 14
    )
  ) {

    return few;

  }


  return many;

}


/* =====================================================
   MODAL — KLIKNIĘCIE W TŁO
===================================================== */

document
  .getElementById("deleteModal")
  .addEventListener(
    "click",
    function(event) {

      if (
        event.target === this
      ) {

        closeDeleteModal();

      }

    }
  );


/* =====================================================
   ESC — ZAMKNIĘCIE MODALA
===================================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      closeDeleteModal();

    }

  }
);


/* =====================================================
   START

loadPolls();
