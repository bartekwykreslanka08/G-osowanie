<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Głosowanie</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #f4f6fb;
  --card: #fff;
  --text: #111827;
  --muted: #6b7280;
  --border: #e5e7eb;
  --primary: #4f46e5;
  --primary-dark: #4338ca;
  --danger: #dc2626;
  --success: #16a34a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

button,
input {
  font: inherit;
}

header {
  padding: 50px 20px 90px;
  text-align: center;
  color: white;
  background: linear-gradient(135deg, #111827, #312e81, #4f46e5);
}

.logo {
  width: 70px;
  height: 70px;
  margin: 0 auto 18px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 22px;
  background: rgba(255,255,255,.15);

  font-size: 34px;
}

header h1 {
  margin: 0;
  font-size: clamp(36px, 8vw, 58px);
}

header p {
  margin: 14px auto 0;
  max-width: 600px;

  color: rgba(255,255,255,.8);
  line-height: 1.6;
}

main {
  width: min(900px, calc(100% - 24px));
  margin: -45px auto 50px;
}

.card {
  background: var(--card);
  border-radius: 20px;
  box-shadow: 0 10px 35px rgba(15,23,42,.08);
}

.create {
  padding: 25px;
  margin-bottom: 30px;
}

.title {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.title-icon {
  width: 45px;
  height: 45px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 13px;

  background: #eef2ff;
  color: var(--primary);

  font-size: 23px;
}

.title h2 {
  margin: 0;
}

.title p {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 13px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;

  border: 1px solid var(--border);
  border-radius: 12px;

  outline: none;
}

input:focus {
  border-color: #818cf8;
  box-shadow: 0 0 0 4px rgba(99,102,241,.12);
}

.label {
  display: block;
  margin: 10px 0;

  color: #374151;
  font-size: 13px;
  font-weight: bold;
}

.create-button {
  width: 100%;
  padding: 14px;

  border: 0;
  border-radius: 12px;

  background: linear-gradient(135deg, #4f46e5, #6366f1);

  color: white;
  font-weight: bold;

  cursor: pointer;
}

.create-button:disabled {
  opacity: .6;
  cursor: wait;
}

#message {
  margin-bottom: 15px;
}

.message {
  padding: 14px 16px;
  border-radius: 12px;
  font-weight: bold;
}

.message.success {
  background: #dcfce7;
  color: #166534;
}

.message.error {
  background: #fee2e2;
  color: #991b1b;
}

.polls-header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin: 0 3px 15px;
}

.polls-header h2 {
  margin: 0;
}

.count {
  padding: 6px 11px;

  border-radius: 999px;

  background: #e0e7ff;
  color: #4338ca;

  font-size: 12px;
  font-weight: bold;
}

.poll {
  padding: 23px;
  margin-bottom: 17px;
}

.poll-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 15px;
}

.question {
  margin: 0;

  font-size: 21px;
  line-height: 1.4;

  overflow-wrap: anywhere;
}

.delete {
  flex-shrink: 0;

  padding: 8px 11px;

  border: 1px solid #fecaca;
  border-radius: 9px;

  background: white;
  color: var(--danger);

  font-size: 12px;
  font-weight: bold;

  cursor: pointer;
}

.delete:hover {
  background: #fef2f2;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 10px 0 20px;
}

.badge {
  padding: 6px 9px;

  border-radius: 8px;

  background: #f3f4f6;
  color: var(--muted);

  font-size: 12px;
}

.badge.voted {
  background: #dcfce7;
  color: #166534;
}

.option {
  margin: 12px 0;
}

.vote {
  position: relative;
  overflow: hidden;

  width: 100%;
  min-height: 53px;

  padding: 14px;

  border: 1px solid var(--border);
  border-radius: 12px;

  background: white;

  text-align: left;

  cursor: pointer;
}

.vote:hover:not(:disabled) {
  border-color: #818cf8;
}

.vote:disabled {
  cursor: default;
}

.progress {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;

  background: #eef2ff;
}

.vote-content {
  position: relative;
  z-index: 2;

  display: flex;
  justify-content: space-between;

  gap: 10px;

  font-weight: bold;
}

.option-text {
  overflow-wrap: anywhere;
}

.percent {
  color: var(--muted);
  flex-shrink: 0;
}

.option-info {
  display: flex;
  justify-content: space-between;

  padding: 5px 4px 0;

  color: var(--muted);

  font-size: 12px;
}

.loading,
.empty {
  padding: 50px 20px;
  text-align: center;
}

.spinner {
  width: 32px;
  height: 32px;

  margin: 0 auto 13px;

  border: 3px solid #e5e7eb;
  border-top-color: var(--primary);

  border-radius: 50%;

  animation: spin .7s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.empty-icon {
  font-size: 45px;
  margin-bottom: 10px;
}

.empty h3 {
  margin: 0 0 7px;
}

.empty p {
  margin: 0;
  color: var(--muted);
}

.modal {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(15,23,42,.55);
  backdrop-filter: blur(4px);
}

.modal.show {
  display: flex;
}

.modal-box {
  width: min(420px, 100%);

  padding: 25px;

  border-radius: 20px;

  background: white;
}

.modal-box h3 {
  margin-top: 0;
}

.modal-box p {
  color: var(--muted);
  line-height: 1.5;
}

.modal-buttons {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.modal-buttons button {
  flex: 1;
  padding: 12px;

  border-radius: 10px;

  cursor: pointer;
  font-weight: bold;
}

.cancel {
  border: 1px solid var(--border);
  background: white;
}

.confirm {
  border: 0;
  background: var(--danger);
  color: white;
}

footer {
  padding: 20px;
  text-align: center;
  color: #9ca3af;
  font-size: 12px;
}

@media(max-width:600px) {

  header {
    padding: 40px 18px 75px;
  }

  main {
    width: calc(100% - 18px);
  }

  .create,
  .poll {
    padding: 18px;
  }

  .poll-top {
    flex-direction: column;
  }

  .delete {
    align-self: flex-end;
  }

}
</style>
</head>

<body>

<header>

  <div class="logo">
    🗳️
  </div>

  <h1>Głosowanie</h1>

  <p>
    Twórz ankiety, głosuj i sprawdzaj wyniki.
  </p>

</header>


<main>

  <div id="message"></div>


  <!-- TWORZENIE ANKIETY -->

  <section class="card create">

    <div class="title">

      <div class="title-icon">
        ＋
      </div>

      <div>
        <h2>Nowa ankieta</h2>

        <p>
          Utwórz pytanie i dodaj odpowiedzi.
        </p>
      </div>

    </div>


    <input
      id="question"
      maxlength="200"
      placeholder="Wpisz pytanie ankiety"
    >


    <span class="label">
      Odpowiedzi
    </span>


    <input
      id="option1"
      maxlength="100"
      placeholder="Odpowiedź A"
    >

    <input
      id="option2"
      maxlength="100"
      placeholder="Odpowiedź B"
    >

    <input
      id="option3"
      maxlength="100"
      placeholder="Odpowiedź C — opcjonalnie"
    >

    <input
      id="option4"
      maxlength="100"
      placeholder="Odpowiedź D — opcjonalnie"
    >


    <button
      id="createButton"
      class="create-button"
      onclick="createPoll()"
    >
      ＋ Utwórz ankietę
    </button>

  </section>


  <div class="polls-header">

    <h2>
      📊 Ankiety
    </h2>

    <span
      id="pollCount"
      class="count"
    >
      0
    </span>

  </div>


  <div id="polls">

    <div class="card loading">

      <div class="spinner"></div>

      Ładowanie ankiet...

    </div>

  </div>

</main>


<footer>
  Głosowanie
</footer>


<!-- MODAL -->

<div
  id="deleteModal"
  class="modal"
>

  <div class="modal-box">

    <h3>
      Usunąć ankietę?
    </h3>

    <p>
      Ankieta i jej odpowiedzi zostaną usunięte.
    </p>

    <div class="modal-buttons">

      <button
        class="cancel"
        onclick="closeDeleteModal()"
      >
        Anuluj
      </button>

      <button
        id="confirmDelete"
        class="confirm"
        onclick="deletePoll()"
      >
        Usuń
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://hvloevnsrbfmmrkohzxe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable__iN5fmthHgtL_WfMM08sUw_7PCFKJgl";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   UŻYTKOWNIK
===================================================== */

function getUserId() {

  let id =
    localStorage.getItem("voter_id");

  if (!id) {

    id =
      crypto.randomUUID();

    localStorage.setItem(
      "voter_id",
      id
    );
  }

  return id;
}


const userId =
  getUserId();


/*
 * Lokalnie zapamiętujemy ankiety,
 * na które ta przeglądarka już głosowała.
 *
 * Samo zabezpieczenie przed drugim głosem
 * nadal musi być w bazie UNIQUE(poll_id,user_id).
 */

function getVotedPolls() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "voted_polls"
      ) || "[]"
    );

  } catch {

    return [];

  }

}


function hasVoted(pollId) {

  return getVotedPolls()
    .includes(
      String(pollId)
    );

}


function rememberVote(pollId) {

  const voted =
    getVotedPolls();

  const id =
    String(pollId);

  if (!voted.includes(id)) {

    voted.push(id);

    localStorage.setItem(
      "voted_polls",
      JSON.stringify(voted)
    );

  }

}


/* =====================================================
   WIADOMOŚCI
===================================================== */

function showMessage(
  text,
  type = "error"
) {

  const box =
    document.getElementById(
      "message"
    );

  box.innerHTML = "";

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message " + type;

  div.textContent =
    text;

  box.appendChild(div);

  setTimeout(() => {

    box.innerHTML = "";

  }, 4000);

}


/* =====================================================
   ŁADOWANIE ANKIET
===================================================== */

async function loadPolls() {

  const container =
    document.getElementById(
      "polls"
    );


  container.innerHTML = `
    <div class="card loading">

      <div class="spinner"></div>

      Ładowanie ankiet...

    </div>
  `;


  try {

    /*
     * WAŻNE:
     *
     * Pobieramy TYLKO polls + options.
     *
     * Nie pytamy tutaj tabeli votes.
     * Nie używamy RPC.
     * Nie ma więc możliwości,
     * żeby RLS tabeli votes zatrzymał
     * ładowanie strony.
     */

    const {
      data,
      error
    } =
      await supabaseClient
        .from("polls")
        .select(`
          id,
          question,
          created_at,
          author_id,
          options (
            id,
            text,
            votes
          )
        `)
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      throw error;

    }


    const polls =
      data || [];


    document.getElementById(
      "pollCount"
    ).textContent =
      polls.length;


    if (polls.length === 0) {

      container.innerHTML = `
        <div class="card empty">

          <div class="empty-icon">
            📊
          </div>

          <h3>
            Brak ankiet
          </h3>

          <p>
            Utwórz pierwszą ankietę powyżej.
          </p>

        </div>
      `;

      return;

    }


    container.innerHTML = "";


    polls.forEach(
      poll => {

        renderPoll(poll);

      }
    );


  } catch (error) {

    console.error(
      "BŁĄD ŁADOWANIA:",
      error
    );


    container.innerHTML = `
      <div class="card empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <h3>
          Nie udało się załadować ankiet
        </h3>

        <p>
          ${escapeHtml(
            error.message ||
            "Wystąpił nieznany błąd."
          )}
        </p>

      </div>
    `;

  }

}


/* =====================================================
   WYŚWIETLANIE ANKIETY
===================================================== */

function renderPoll(poll) {

  const container =
    document.getElementById(
      "polls"
    );


  const card =
    document.createElement(
      "article"
    );

  card.className =
    "card poll";


  const top =
    document.createElement(
      "div"
    );

  top.className =
    "poll-top";


  const question =
    document.createElement(
      "h2"
    );

  question.className =
    "question";

  question.textContent =
    poll.question;


  top.appendChild(
    question
  );


  /*
   * Tylko autorowi pokazujemy usuwanie.
   */

  if (
    String(poll.author_id) ===
    String(userId)
  ) {

    const deleteButton =
      document.createElement(
        "button"
      );

    deleteButton.className =
      "delete";

    deleteButton.textContent =
      "🗑️ Usuń";

    deleteButton.onclick =
      () => openDeleteModal(
        poll.id
      );

    top.appendChild(
      deleteButton
    );

  }


  card.appendChild(
    top
  );


  const options =
    Array.isArray(poll.options)
      ? poll.options
      : [];


  /*
   * LICZYMY PRAWDZIWĄ SUMĘ
   * Z LICZNIKÓW W options.
   */

  const totalVotes =
    options.reduce(
      (sum, option) => {

        return sum +
          Math.max(
            0,
            Number(
              option.votes || 0
            )
          );

      },
      0
    );


  /* META */

  const meta =
    document.createElement(
      "div"
    );

  meta.className =
    "meta";


  const dateBadge =
    document.createElement(
      "span"
    );

  dateBadge.className =
    "badge";

  dateBadge.textContent =
    "📅 " +
    new Date(
      poll.created_at
    ).toLocaleDateString(
      "pl-PL"
    );


  meta.appendChild(
    dateBadge
  );


  const voteBadge =
    document.createElement(
      "span"
    );

  voteBadge.className =
    "badge";

  voteBadge.textContent =
    "🗳️ " +
    totalVotes +
    " " +
    pluralize(
      totalVotes,
      "głos",
      "głosy",
      "głosów"
    );


  meta.appendChild(
    voteBadge
  );


  if (
    hasVoted(
      poll.id
    )
  ) {

    const votedBadge =
      document.createElement(
        "span"
      );

    votedBadge.className =
      "badge voted";

    votedBadge.textContent =
      "✓ Zagłosowano";

    meta.appendChild(
      votedBadge
    );

  }


  card.appendChild(
    meta
  );


  /* ODPOWIEDZI */

  options.forEach(
    (option, index) => {

      const optionVotes =
        Math.max(
          0,
          Number(
            option.votes || 0
          )
        );


      /*
       * Jeżeli nie ma żadnych głosów,
       * wszystkie procenty = 0%.
       */

      let percentage = 0;


      if (
        totalVotes > 0
      ) {

        percentage =
          Math.round(
            (
              optionVotes /
              totalVotes
            ) * 100
          );

      }


      const row =
        document.createElement(
          "div"
        );

      row.className =
        "option";


      const button =
        document.createElement(
          "button"
        );

      button.className =
        "vote";


      const alreadyVoted =
        hasVoted(
          poll.id
        );


      button.disabled =
        alreadyVoted;


      const progress =
        document.createElement(
          "div"
        );

      progress.className =
        "progress";

      progress.style.width =
        percentage + "%";


      const content =
        document.createElement(
          "div"
        );

      content.className =
        "vote-content";


      const text =
        document.createElement(
          "span"
        );

      text.className =
        "option-text";

      text.textContent =
        option.text;


      const percent =
        document.createElement(
          "span"
        );

      percent.className =
        "percent";

      percent.textContent =
        percentage + "%";


      content.appendChild(
        text
      );

      content.appendChild(
        percent
      );


      button.appendChild(
        progress
      );

      button.appendChild(
        content
      );


      if (!alreadyVoted) {

        button.onclick =
          () => vote(
            poll.id,
            option.id
          );

      }


      row.appendChild(
        button
      );


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "option-info";


      const votesText =
        document.createElement(
          "span"
        );

      votesText.textContent =
        optionVotes +
        " " +
        pluralize(
          optionVotes,
          "głos",
          "głosy",
          "głosów"
        );


      const answerText =
        document.createElement(
          "span"
        );

      answerText.textContent =
        "Odpowiedź " +
        (index + 1);


      info.appendChild(
        votesText
      );

      info.appendChild(
        answerText
      );


      row.appendChild(
        info
      );


      card.appendChild(
        row
      );

    }
  );


  container.appendChild(
    card
  );

}


/* =====================================================
   TWORZENIE ANKIETY
===================================================== */

async function createPoll() {

  const button =
    document.getElementById(
      "createButton"
    );


  const question =
    document
      .getElementById("question")
      .value
      .trim();


  const options = [

    document
      .getElementById("option1")
      .value
      .trim(),

    document
      .getElementById("option2")
      .value
      .trim(),

    document
      .getElementById("option3")
      .value
      .trim(),

    document
      .getElementById("option4")
      .value
      .trim()

  ].filter(Boolean);


  if (!question) {

    showMessage(
      "Wpisz pytanie."
    );

    return;

  }


  if (
    options.length < 2
  ) {

    showMessage(
      "Dodaj przynajmniej 2 odpowiedzi."
    );

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "Tworzenie...";


  try {

    const {
      data: poll,
      error: pollError
    } =
      await supabaseClient
        .from("polls")
        .insert({
          question: question,
          author_id: userId
        })
        .select()
        .single();


    if (pollError) {

      throw pollError;

    }


    const optionRows =
      options.map(
        text => ({
          poll_id: poll.id,
          text: text,
          votes: 0
        })
      );


    const {
      error: optionsError
    } =
      await supabaseClient
        .from("options")
        .insert(
          optionRows
        );


    if (optionsError) {

      /*
       * Spróbuj usunąć ankietę,
       * jeżeli dodawanie odpowiedzi
       * się nie udało.
       */

      await supabaseClient
        .from("polls")
        .delete()
        .eq(
          "id",
          poll.id
        );


      throw optionsError;

    }


    document.getElementById(
      "question"
    ).value = "";

    document.getElementById(
      "option1"
    ).value = "";

    document.getElementById(
      "option2"
    ).value = "";

    document.getElementById(
      "option3"
    ).value = "";

    document.getElementById(
      "option4"
    ).value = "";


    showMessage(
      "Ankieta została utworzona!",
      "success"
    );


    await loadPolls();


  } catch (error) {

    console.error(
      "CREATE ERROR:",
      error
    );

    showMessage(
      error.message ||
      "Nie udało się utworzyć ankiety."
    );


  } finally {

    button.disabled =
      false;

    button.textContent =
      "＋ Utwórz ankietę";

  }

}

  /* =====================================================
   GŁOSOWANIE
===================================================== */

async function vote(pollId, optionId) {

  if (hasVoted(pollId)) {

    showMessage(
      "Na tę ankietę już głosowałeś."
    );

    return;
  }


  try {

    /*
     * Najpierw zapisujemy głos.
     *
     * Tabela votes:
     * poll_id
     * user_id
     *
     * Para poll_id + user_id powinna
     * mieć UNIQUE w Supabase.
     */

    const {
      error: voteError
    } =
      await supabaseClient
        .from("votes")
        .insert({
          poll_id: pollId,
          user_id: userId
        });


    if (voteError) {

      /*
       * 23505 = użytkownik już oddał
       * głos na tę ankietę.
       */

      if (voteError.code === "23505") {

        rememberVote(pollId);

        showMessage(
          "Na tę ankietę już głosowałeś."
        );

        await loadPolls();

        return;
      }


      throw voteError;
    }


    /*
     * Pobieramy aktualną liczbę głosów
     * wybranej odpowiedzi.
     */

    const {
      data: option,
      error: optionError
    } =
      await supabaseClient
        .from("options")
        .select("votes")
        .eq("id", optionId)
        .single();


    if (optionError) {

      throw optionError;

    }


    const currentVotes =
      Number(option.votes || 0);


    /*
     * Zwiększamy licznik o 1.
     */

    const {
      error: updateError
    } =
      await supabaseClient
        .from("options")
        .update({
          votes: currentVotes + 1
        })
        .eq("id", optionId);


    if (updateError) {

      throw updateError;

    }


    /*
     * Zapamiętujemy głos w tej
     * przeglądarce.
     */

    rememberVote(pollId);


    showMessage(
      "Głos został zapisany!",
      "success"
    );


    /*
     * Pobieramy aktualne wyniki.
     */

    await loadPolls();


  } catch (error) {

    console.error(
      "VOTE ERROR:",
      error
    );


    showMessage(
      error.message ||
      "Nie udało się oddać głosu."
    );

  }

}


/* =====================================================
   USUWANIE ANKIETY
===================================================== */

let pollToDelete = null;


function openDeleteModal(pollId) {

  pollToDelete =
    pollId;


  document
    .getElementById("deleteModal")
    .classList.add("show");

}


function closeDeleteModal() {

  pollToDelete =
    null;


  document
    .getElementById("deleteModal")
    .classList.remove("show");

}


async function deletePoll() {

  if (pollToDelete === null) {

    return;

  }


  const pollId =
    pollToDelete;


  const button =
    document.getElementById(
      "confirmDelete"
    );


  button.disabled =
    true;

  button.textContent =
    "Usuwanie...";


  try {

    /*
     * Usuwamy tylko ankietę,
     * której autorem jest aktualny użytkownik.
     */

    const {
      error
    } =
      await supabaseClient
        .from("polls")
        .delete()
        .eq(
          "id",
          pollId
        )
        .eq(
          "author_id",
          userId
        );


    if (error) {

      throw error;

    }


    /*
     * Usuwanie powiązanych options/votes
     * powinno być skonfigurowane w Supabase
     * przez ON DELETE CASCADE.
     */


    closeDeleteModal();


    showMessage(
      "Ankieta została usunięta.",
      "success"
    );


    await loadPolls();


  } catch (error) {

    console.error(
      "DELETE ERROR:",
      error
    );


    showMessage(
      error.message ||
      "Nie udało się usunąć ankiety."
    );


  } finally {

    button.disabled =
      false;

    button.textContent =
      "Usuń";

  }

}


/* =====================================================
   POMOCNICZE
===================================================== */

function pluralize(
  number,
  one,
  few,
  many
) {

  number =
    Math.abs(
      Number(number)
    );


  if (number === 1) {

    return one;

  }


  const lastTwo =
    number % 100;

  const last =
    number % 10;


  if (
    last >= 2 &&
    last <= 4 &&
    !(
      lastTwo >= 12 &&
      lastTwo <= 14
    )
  ) {

    return few;

  }


  return many;

}


function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text ?? "";


  return div.innerHTML;

}


/* =====================================================
   OBSŁUGA MODALA
===================================================== */

document
  .getElementById("deleteModal")
  .addEventListener(
    "click",
    function(event) {

      /*
       * Kliknięcie w przyciemnione tło
       * zamyka modal.
       */

      if (
        event.target === this
      ) {

        closeDeleteModal();

      }

    }
  );


document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      closeDeleteModal();

    }

  }
);


/* =====================================================
   START STRONY
===================================================== */

loadPolls();
