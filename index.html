<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Głosowanie</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #111827;
  --muted: #6b7280;
  --border: #e5e7eb;
  --primary: #4f46e5;
  --primary-dark: #4338ca;
  --danger: #dc2626;
  --success: #16a34a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

button,
input {
  font: inherit;
}

header {
  padding: 55px 20px 90px;
  color: white;
  text-align: center;
  background: linear-gradient(
    135deg,
    #111827,
    #312e81,
    #4f46e5
  );
}

header .icon {
  width: 70px;
  height: 70px;
  margin: 0 auto 18px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 22px;
  background: rgba(255,255,255,.14);

  font-size: 34px;
}

header h1 {
  margin: 0;
  font-size: clamp(36px, 8vw, 60px);
}

header p {
  max-width: 600px;
  margin: 14px auto 0;
  color: rgba(255,255,255,.78);
  line-height: 1.6;
}

main {
  width: min(900px, calc(100% - 28px));
  margin: -45px auto 50px;
}

.card {
  background: var(--card);
  border-radius: 22px;
  box-shadow: 0 10px 35px rgba(15,23,42,.08);
}

.create {
  padding: 26px;
  margin-bottom: 30px;
}

.title-row {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-bottom: 22px;
}

.title-icon {
  width: 44px;
  height: 44px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 13px;

  background: #eef2ff;
  color: var(--primary);

  font-size: 23px;
}

.title-row h2 {
  margin: 0;
  font-size: 22px;
}

.title-row p {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 13px;
}

input {
  width: 100%;
  padding: 14px 15px;
  margin-bottom: 10px;

  border: 1px solid var(--border);
  border-radius: 12px;

  outline: none;
  transition: .2s;
}

input:focus {
  border-color: #818cf8;

  box-shadow:
    0 0 0 4px
    rgba(99,102,241,.12);
}

.label {
  display: block;
  margin: 10px 0 9px;

  color: #374151;

  font-size: 13px;
  font-weight: bold;
}

.create-button {
  width: 100%;
  padding: 14px;

  border: 0;
  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #4f46e5,
      #6366f1
    );

  color: white;
  font-weight: bold;

  cursor: pointer;
}

.create-button:hover {
  background:
    linear-gradient(
      135deg,
      #4338ca,
      #4f46e5
    );
}

.create-button:disabled {
  opacity: .6;
  cursor: wait;
}

#message {
  margin-bottom: 15px;
}

.message {
  padding: 14px 16px;
  border-radius: 12px;

  font-size: 14px;
  font-weight: 600;
}

.message.success {
  color: #166534;
  background: #dcfce7;
}

.message.error {
  color: #991b1b;
  background: #fee2e2;
}

.polls-header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  margin: 0 3px 15px;
}

.polls-header h2 {
  margin: 0;
  font-size: 22px;
}

.count {
  padding: 6px 11px;

  border-radius: 999px;

  background: #e0e7ff;
  color: #4338ca;

  font-size: 12px;
  font-weight: bold;
}

.poll {
  padding: 24px;
  margin-bottom: 17px;
}

.poll-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;

  gap: 15px;
}

.question {
  margin: 0;

  font-size: 21px;
  line-height: 1.4;

  overflow-wrap: anywhere;
}

.delete {
  flex-shrink: 0;

  padding: 8px 11px;

  border: 1px solid #fecaca;
  border-radius: 9px;

  background: white;
  color: var(--danger);

  font-size: 12px;
  font-weight: bold;

  cursor: pointer;
}

.delete:hover {
  background: #fef2f2;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;

  margin: 10px 0 20px;
}

.badge {
  padding: 5px 8px;

  border-radius: 7px;

  background: #f3f4f6;

  color: var(--muted);

  font-size: 12px;
}

.badge.voted {
  background: #dcfce7;
  color: #166534;
}

.option {
  margin: 12px 0;
}

.vote {
  position: relative;
  overflow: hidden;

  width: 100%;
  min-height: 52px;

  padding: 14px 15px;

  border: 1px solid var(--border);
  border-radius: 12px;

  background: white;

  text-align: left;

  cursor: pointer;

  transition: .2s;
}

.vote:hover:not(:disabled) {
  border-color: #818cf8;
  transform: translateY(-1px);
}

.vote:disabled {
  cursor: default;
}

.progress {
  position: absolute;
  inset: 0 auto 0 0;

  width: 0;

  background: #eef2ff;

  transition: width .5s;
}

.vote-content {
  position: relative;
  z-index: 2;

  display: flex;
  justify-content: space-between;

  gap: 10px;

  font-weight: 600;
}

.option-text {
  overflow-wrap: anywhere;
}

.percent {
  flex-shrink: 0;
  color: var(--muted);
  font-size: 13px;
}

.option-info {
  display: flex;
  justify-content: space-between;

  padding: 5px 4px 0;

  color: var(--muted);

  font-size: 12px;
}

.empty {
  padding: 55px 20px;
  text-align: center;
}

.empty-icon {
  font-size: 45px;
  margin-bottom: 10px;
}

.empty h3 {
  margin: 0 0 7px;
}

.empty p {
  margin: 0;
  color: var(--muted);
}

.loading {
  padding: 50px;
  text-align: center;
  color: var(--muted);
}

.spinner {
  width: 30px;
  height: 30px;

  margin: 0 auto 12px;

  border: 3px solid #e5e7eb;
  border-top-color: var(--primary);

  border-radius: 50%;

  animation: spin .7s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.modal {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(15,23,42,.55);

  backdrop-filter: blur(4px);
}

.modal.show {
  display: flex;
}

.modal-box {
  width: min(420px,100%);

  padding: 25px;

  border-radius: 20px;

  background: white;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.25);
}

.modal-box h3 {
  margin: 0 0 8px;
}

.modal-box p {
  margin: 0;

  color: var(--muted);
  line-height: 1.5;
}

.modal-buttons {
  display: flex;
  gap: 10px;

  margin-top: 22px;
}

.modal-buttons button {
  flex: 1;

  padding: 12px;

  border-radius: 10px;

  cursor: pointer;
  font-weight: bold;
}

.cancel {
  border: 1px solid var(--border);
  background: white;
}

.confirm {
  border: 0;
  background: var(--danger);
  color: white;
}

footer {
  padding: 20px;

  text-align: center;

  color: #9ca3af;

  font-size: 12px;
}

@media(max-width:600px) {

  header {
    padding: 40px 18px 75px;
  }

  main {
    width: calc(100% - 20px);
  }

  .create,
  .poll {
    padding: 19px;
  }

  .poll-top {
    flex-direction: column;
  }

  .delete {
    align-self: flex-end;
  }

  .question {
    font-size: 19px;
  }

  .modal-buttons {
    flex-direction: column-reverse;
  }

}

</style>
</head>

<body>

<header>

  <div class="icon">
    🗳️
  </div>

  <h1>Głosowanie</h1>

  <p>
    Twórz ankiety, głosuj i sprawdzaj
    rzeczywiste wyniki głosowania.
  </p>

</header>

<main>

  <div id="message"></div>

  <section class="card create">

    <div class="title-row">

      <div class="title-icon">
        ＋
      </div>

      <div>

        <h2>Nowa ankieta</h2>

        <p>
          Utwórz pytanie i dodaj odpowiedzi.
        </p>

      </div>

    </div>

    <input
      id="question"
      maxlength="200"
      placeholder="Wpisz pytanie ankiety"
    >

    <span class="label">
      Odpowiedzi
    </span>

    <input
      id="option1"
      maxlength="100"
      placeholder="Odpowiedź A"
    >

    <input
      id="option2"
      maxlength="100"
      placeholder="Odpowiedź B"
    >

    <input
      id="option3"
      maxlength="100"
      placeholder="Odpowiedź C — opcjonalnie"
    >

    <input
      id="option4"
      maxlength="100"
      placeholder="Odpowiedź D — opcjonalnie"
    >

    <button
      id="createButton"
      class="create-button"
      onclick="createPoll()"
    >
      ＋ Utwórz ankietę
    </button>

  </section>

  <div class="polls-header">

    <h2>
      📊 Ankiety
    </h2>

    <span
      id="pollCount"
      class="count"
    >
      0
    </span>

  </div>

  <div id="polls">

    <div class="card loading">

      <div class="spinner"></div>

      Ładowanie ankiet...

    </div>

  </div>

</main>

<footer>
  Głosowanie
</footer>

<div
  id="deleteModal"
  class="modal"
>

  <div class="modal-box">

    <h3>
      Usunąć ankietę?
    </h3>

    <p>
      Ankieta, odpowiedzi i głosy zostaną
      usunięte. Tej operacji nie można cofnąć.
    </p>

    <div class="modal-buttons">

      <button
        class="cancel"
        onclick="closeDeleteModal()"
      >
        Anuluj
      </button>

      <button
        id="confirmDelete"
        class="confirm"
        onclick="deletePoll()"
      >
        Usuń
      </button>

    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://hvloevnsrbfmmrkohzxe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable__iN5fmthHgtL_WfMM08sUw_7PCFKJgl";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

function getUserId() {

  let id =
    localStorage.getItem("voter_id");

  if (!id) {

    id =
      crypto.randomUUID();

    localStorage.setItem(
      "voter_id",
      id
    );

  }

  return id;
}

const userId = getUserId();

function showMessage(
  text,
  type = "error"
) {

  const box =
    document.getElementById("message");

  box.innerHTML = "";

  const message =
    document.createElement("div");

  message.className =
    `message ${type}`;

  message.textContent =
    text;

  box.appendChild(message);

  setTimeout(() => {
    box.innerHTML = "";
  }, 4500);
}


/*
 * ŁADUJEMY ANKIETY ORAZ PRAWDZIWE GŁOSY
 * Z TABELI votes.
 */
async function loadPolls() {

  const container =
    document.getElementById("polls");

  container.innerHTML = `
    <div class="card loading">
      <div class="spinner"></div>
      Ładowanie ankiet...
    </div>
  `;

  try {

    const {
      data: polls,
      error: pollsError
    } =
      await supabaseClient
        .from("polls")
        .select(`
          id,
          question,
          created_at,
          author_id,
          options (
            id,
            text
          )
        `)
        .order(
          "created_at",
          {
            ascending: false
          }
        );

    if (pollsError) {
      throw pollsError;
    }


    /*
     * Pobieramy wszystkie głosy.
     *
     * NIE używamy już options.votes.
     * Dzięki temu liczby są liczone
     * bezpośrednio z faktycznych rekordów votes.
     */
    const {
      data: votes,
      error: votesError
    } =
      await supabaseClient
        .from("votes")
        .select(`
          poll_id,
          option_id,
          user_id
        `);

    if (votesError) {
      throw votesError;
    }


    /*
     * Grupujemy głosy według ankiety
     * i odpowiedzi.
     */
    const voteMap =
      new Map();

    const votedPolls =
      new Set();

    (votes || []).forEach(
      vote => {

        const pollId =
          String(vote.poll_id);

        const optionId =
          String(vote.option_id);

        if (!voteMap.has(pollId)) {
          voteMap.set(
            pollId,
            new Map()
          );
        }

        const pollVotes =
          voteMap.get(pollId);

        pollVotes.set(
          optionId,
          (pollVotes.get(optionId) || 0) + 1
        );

        if (
          String(vote.user_id) ===
          String(userId)
        ) {

          votedPolls.add(
            pollId
          );

        }

      }
    );


    document.getElementById(
      "pollCount"
    ).textContent =
      polls.length;


    if (!polls.length) {

      container.innerHTML = `
        <div class="card empty">

          <div class="empty-icon">
            📊
          </div>

          <h3>
            Brak ankiet
          </h3>

          <p>
            Utwórz pierwszą ankietę powyżej.
          </p>

        </div>
      `;

      return;
    }


    container.innerHTML = "";


    polls.forEach(
      poll => {

        renderPoll(
          poll,
          voteMap.get(
            String(poll.id)
          ) || new Map(),
          votedPolls.has(
            String(poll.id)
          )
        );

      }
    );

  } catch (error) {

    console.error(
      "LOAD POLLS ERROR:",
      error
    );

    container.innerHTML = `
      <div class="card empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <h3>
          Nie udało się załadować ankiet
        </h3>

        <p>
          ${escapeHtml(
            error.message ||
            "Nieznany błąd"
          )}
        </p>

      </div>
    `;

  }

}
  <script>

/* =====================================================
   RENDER ANKIETY
===================================================== */

function renderPoll(
  poll,
  pollVotes,
  hasVoted
) {

  const container =
    document.getElementById("polls");

  const card =
    document.createElement("article");

  card.className =
    "card poll";


  const top =
    document.createElement("div");

  top.className =
    "poll-top";


  const question =
    document.createElement("h2");

  question.className =
    "question";

  question.textContent =
    poll.question;

  top.appendChild(question);


  /*
   * Autor może usunąć swoją ankietę.
   */

  if (
    String(poll.author_id) ===
    String(userId)
  ) {

    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete";

    deleteButton.textContent =
      "🗑️ Usuń";

    deleteButton.onclick =
      () => openDeleteModal(
        poll.id
      );

    top.appendChild(
      deleteButton
    );
  }


  card.appendChild(top);


  const options =
    poll.options || [];


  /*
   * LICZBA GŁOSÓW JEST LICZONA
   * WYŁĄCZNIE Z TABELI votes.
   */

  let totalVotes = 0;


  options.forEach(
    option => {

      totalVotes +=
        Number(
          pollVotes.get(
            String(option.id)
          ) || 0
        );

    }
  );


  /* META */

  const meta =
    document.createElement("div");

  meta.className =
    "meta";


  const date =
    new Date(
      poll.created_at
    ).toLocaleDateString(
      "pl-PL"
    );


  const dateBadge =
    document.createElement("span");

  dateBadge.className =
    "badge";

  dateBadge.textContent =
    `📅 ${date}`;

  meta.appendChild(
    dateBadge
  );


  const voteBadge =
    document.createElement("span");

  voteBadge.className =
    "badge";

  voteBadge.textContent =
    `🗳️ ${totalVotes} ${
      pluralize(
        totalVotes,
        "głos",
        "głosy",
        "głosów"
      )
    }`;

  meta.appendChild(
    voteBadge
  );


  if (hasVoted) {

    const votedBadge =
      document.createElement("span");

    votedBadge.className =
      "badge voted";

    votedBadge.textContent =
      "✓ Zagłosowano";

    meta.appendChild(
      votedBadge
    );

  }


  card.appendChild(meta);


  /* ODPOWIEDZI */

  options.forEach(
    (option, index) => {

      const row =
        document.createElement("div");

      row.className =
        "option";


      const optionVotes =
        Number(
          pollVotes.get(
            String(option.id)
          ) || 0
        );


      /*
       * Procent liczymy z dokładnych
       * wartości z tabeli votes.
       */

      const percentage =
        totalVotes === 0
          ? 0
          : Math.round(
              (
                optionVotes /
                totalVotes
              ) * 100
            );


      const button =
        document.createElement("button");

      button.className =
        "vote";

      button.disabled =
        hasVoted;


      const progress =
        document.createElement("div");

      progress.className =
        "progress";

      progress.style.width =
        `${percentage}%`;


      const content =
        document.createElement("div");

      content.className =
        "vote-content";


      const text =
        document.createElement("span");

      text.className =
        "option-text";

      text.textContent =
        option.text;


      const percent =
        document.createElement("span");

      percent.className =
        "percent";

      percent.textContent =
        `${percentage}%`;


      content.appendChild(text);
      content.appendChild(percent);

      button.appendChild(progress);
      button.appendChild(content);


      if (!hasVoted) {

        button.onclick =
          () => vote(
            poll.id,
            option.id
          );

      }


      row.appendChild(button);


      const info =
        document.createElement("div");

      info.className =
        "option-info";


      const votesText =
        document.createElement("span");

      votesText.textContent =
        `${optionVotes} ${
          pluralize(
            optionVotes,
            "głos",
            "głosy",
            "głosów"
          )
        }`;


      const answerText =
        document.createElement("span");

      answerText.textContent =
        `Odpowiedź ${index + 1}`;


      info.appendChild(
        votesText
      );

      info.appendChild(
        answerText
      );


      row.appendChild(info);

      card.appendChild(row);

    }
  );


  container.appendChild(card);

}


/* =====================================================
   TWORZENIE ANKIETY
===================================================== */

async function createPoll() {

  const button =
    document.getElementById(
      "createButton"
    );


  const question =
    document
      .getElementById("question")
      .value
      .trim();


  const options = [

    document
      .getElementById("option1")
      .value
      .trim(),

    document
      .getElementById("option2")
      .value
      .trim(),

    document
      .getElementById("option3")
      .value
      .trim(),

    document
      .getElementById("option4")
      .value
      .trim()

  ].filter(Boolean);


  if (!question) {

    showMessage(
      "Wpisz pytanie ankiety."
    );

    return;
  }


  if (options.length < 2) {

    showMessage(
      "Dodaj przynajmniej 2 odpowiedzi."
    );

    return;
  }


  button.disabled =
    true;

  button.textContent =
    "Tworzenie...";


  try {

    const {
      data: poll,
      error: pollError
    } =
      await supabaseClient
        .from("polls")
        .insert({
          question: question,
          author_id: userId
        })
        .select()
        .single();


    if (pollError) {
      throw pollError;
    }


    const optionRows =
      options.map(
        text => ({
          poll_id: poll.id,
          text: text
        })
      );


    const {
      error: optionError
    } =
      await supabaseClient
        .from("options")
        .insert(
          optionRows
        );


    if (optionError) {

      await supabaseClient
        .from("polls")
        .delete()
        .eq(
          "id",
          poll.id
        );

      throw optionError;
    }


    document.getElementById(
      "question"
    ).value = "";

    document.getElementById(
      "option1"
    ).value = "";

    document.getElementById(
      "option2"
    ).value = "";

    document.getElementById(
      "option3"
    ).value = "";

    document.getElementById(
      "option4"
    ).value = "";


    showMessage(
      "Ankieta została utworzona!",
      "success"
    );


    await loadPolls();


  } catch (error) {

    console.error(
      "CREATE POLL ERROR:",
      error
    );

    showMessage(
      error.message ||
      "Nie udało się utworzyć ankiety."
    );

  } finally {

    button.disabled =
      false;

    button.textContent =
      "＋ Utwórz ankietę";

  }

}


/* =====================================================
   GŁOSOWANIE
===================================================== */

async function vote(
  pollId,
  optionId
) {

  try {

    /*
     * Najpierw zapisujemy głos.
     *
     * UNIQUE(poll_id, user_id)
     * zabezpiecza przed drugim głosem.
     */

    const {
      error
    } =
      await supabaseClient
        .from("votes")
        .insert({
          poll_id: pollId,
          option_id: optionId,
          user_id: userId
        });


    if (error) {

      if (
        error.code === "23505"
      ) {

        showMessage(
          "Na tę ankietę już głosowałeś."
        );

        await loadPolls();

        return;
      }

      throw error;
    }


    showMessage(
      "Twój głos został zapisany!",
      "success"
    );


    /*
     * Nie zwiększamy już ręcznie
     * options.votes.
     *
     * Po głosowaniu loadPolls()
     * pobierze rzeczywiste rekordy
     * z tabeli votes.
     */

    await loadPolls();

  } catch (error) {

    console.error(
      "VOTE ERROR:",
      error
    );

    showMessage(
      error.message ||
      "Nie udało się oddać głosu."
    );

  }

}


/* =====================================================
   USUWANIE
===================================================== */

let pollToDelete = null;


function openDeleteModal(
  pollId
) {

  pollToDelete =
    pollId;

  document
    .getElementById(
      "deleteModal"
    )
    .classList.add("show");

}


function closeDeleteModal() {

  pollToDelete =
    null;

  document
    .getElementById(
      "deleteModal"
    )
    .classList.remove("show");

}


async function deletePoll() {

  if (
    pollToDelete === null
  ) {
    return;
  }


  const button =
    document.getElementById(
      "confirmDelete"
    );


  const id =
    pollToDelete;


  button.disabled =
    true;

  button.textContent =
    "Usuwanie...";


  try {

    const {
      error
    } =
      await supabaseClient
        .from("polls")
        .delete()
        .eq(
          "id",
          id
        )
        .eq(
          "author_id",
          userId
        );


    if (error) {
      throw error;
    }


    closeDeleteModal();


    showMessage(
      "Ankieta została usunięta.",
      "success"
    );


    await loadPolls();


  } catch (error) {

    console.error(
      "DELETE ERROR:",
      error
    );

    showMessage(
      error.message ||
      "Nie udało się usunąć ankiety."
    );

  } finally {

    button.disabled =
      false;

    button.textContent =
      "Usuń";

  }

}


/* =====================================================
   POMOCNICZE
===================================================== */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text ?? "";

  return div.innerHTML;

}


function pluralize(
  number,
  one,
  few,
  many
) {

  number =
    Math.abs(
      Number(number)
    );


  if (number === 1) {
    return one;
  }


  const lastTwo =
    number % 100;

  const last =
    number % 10;


  if (
    last >= 2 &&
    last <= 4 &&
    !(
      lastTwo >= 12 &&
      lastTwo <= 14
    )
  ) {

    return few;

  }


  return many;

}
